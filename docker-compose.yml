services:
  postgres:
    image: postgres:16-alpine
    restart: always
    # Logging: json-file by default (dev/E2E); does NOT survive `down`/recreate.
    # Production routes this service to the host journal via
    # docker-compose.prod.override.yml (journald, 14-day retention).
    environment:
      POSTGRES_USER: pevo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pevo_app
    # No host port — only reachable within Docker network
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pevo -d pevo_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  ipfs:
    image: ipfs/kubo:latest
    restart: always
    volumes:
      - ipfs_data:/data/ipfs
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:5001:5001"
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: ["CMD-SHELL", "ipfs dag stat /ipfs/QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    # Give the graceful SIGTERM drain room to finish before Docker SIGKILLs.
    # backend/src/index.ts's shutdown drains the argon2 queue and calls
    # server.close() with up to a 30s deadline; an in-flight IPFS download can
    # hold a connection open near that bound. Compose's default 10s
    # stop_grace_period would SIGKILL mid-drain (truncating in-flight requests on
    # every `./deploy.sh restart` backend swap), so allow 35s > the 30s deadline.
    # This does not slow the common swap: a backend with no long-lived request
    # exits on SIGTERM in well under a second; the grace period is only an upper
    # bound, hit solely when a request is genuinely still draining.
    stop_grace_period: 35s
    # Logging: this base file uses Docker's default json-file driver (dev/E2E).
    # Those logs live in the per-container layer and are DISCARDED on every
    # `down`/recreate (each `./deploy.sh restart`), so they do NOT survive a
    # restart. Production retention is off-container: docker-compose.prod.override.yml
    # routes this service to the host systemd journal (journald, 14-day retention),
    # auto-applied by deploy.sh when a systemd-journal socket is present. Retrieve
    # historical cross-restart logs with `./deploy.sh logs-history`.
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      APP_DATABASE_URL: postgresql://pevo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pevo_app
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      IPFS_API_URL: http://ipfs:5001
      PORT: "3001"
      # Cap libuv thread pool above argon2's effective serialization so the
      # burnSentinel path in backend/src/routes/auth.ts cannot silently throw
      # under concurrent /login, /signup, /resend-verification, /recover load
      # (see comment near SENTINEL_ARGON2_HASH_PROMISE). UV_THREADPOOL_SIZE=16
      # allows ~4 concurrent argon2 ops (argon2 parallelism=4 holds 4 threads
      # per call); the JS-level semaphore in auth.ts is the deterministic cap.
      # Override via .env; default 16 is the minimum for the startup assertion.
      UV_THREADPOOL_SIZE: "${UV_THREADPOOL_SIZE:-16}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m

  # Frontend is served by the backend as static files (Vite build output).
  # Update nginx config: both / and /api/ should proxy to backend:3001.


volumes:
  pgdata:
  redis_data:
  ipfs_data:
