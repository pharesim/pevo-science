services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: pevo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pevo_dev}
      POSTGRES_DB: pevo_app
    # No host port — only reachable within Docker network
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pevo -d pevo_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-pevo_redis_dev}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pevo_redis_dev}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      APP_DATABASE_URL: postgresql://pevo:${POSTGRES_PASSWORD:-pevo_dev}@postgres:5432/pevo_app
      REDIS_URL: redis://:${REDIS_PASSWORD:-pevo_redis_dev}@redis:6379
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m

  # Frontend is served by the backend as static files (Vite build output).
  # Update nginx config: both / and /api/ should proxy to backend:3001.

volumes:
  pgdata:
  redis_data:
