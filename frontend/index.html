<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEvO - Open Scientific Publishing</title>
  <meta name="description" content="Open scientific publication and interactive peer evaluation on a permanent, open record. Non-profit, transparent, forkable." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" />
  <style>[x-cloak] { display: none !important; }</style>
  <script type="module" src="/src/main.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-parchment text-ink">

  <!-- Beta banner -->
  <div x-data="{ dismissed: localStorage.getItem('betaBannerDismissed') === '1' }"
       x-show="!dismissed" x-transition
       class="bg-amber-500 text-white text-center text-sm py-2 px-4 relative">
    <span x-text="$t('betaBanner.message')"></span>
    <button @click="dismissed = true; localStorage.setItem('betaBannerDismissed', '1')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-white/80 hover:text-white transition-colors"
            :aria-label="$t('betaBanner.close')">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- ═══════════════════════════════════════════════ HEADER ═══════════════════════════════════════════════ -->
  <header x-data="header" class="border-b border-parchment-dark bg-white">
    <!-- Brand accent bar -->
    <div class="h-1 bg-linear-to-r rtl:bg-linear-to-l from-pevo-green via-pevo-teal to-pevo-crimson"></div>

    <div class="container-narrow">
      <div class="flex h-16 items-center justify-between">
        <!-- Logo -->
        <a :href="$lp('/')" @click.prevent="navigate('/')" class="flex items-center gap-2.5 no-underline">
          <img src="/images/pevo-logo.png" :alt="$t('aria.pevoLogo')" width="36" height="36" class="rounded-sm" />
          <div class="flex flex-col">
            <span class="text-lg font-bold text-ink leading-tight tracking-tight">pevo</span>
            <span class="hidden sm:block text-[10px] text-ink-muted leading-tight" x-text="$t('header.tagline')"></span>
          </div>
        </a>

        <!-- Desktop Navigation -->
        <nav aria-label="Main navigation" class="hidden md:flex items-center gap-6">
          <template x-for="link in primaryLinks" :key="link.path">
            <a :href="link.path" @click.prevent="navigate(link.path)"
               class="text-sm font-medium text-ink-light hover:text-pevo-teal no-underline transition-colors"
               x-text="link.label"></a>
          </template>
          <!-- More dropdown -->
          <div class="relative" @click.outside="moreOpen = false">
            <button class="text-sm font-medium text-ink-light hover:text-pevo-teal transition-colors flex items-center gap-1"
                    @click="moreOpen = !moreOpen" :aria-expanded="moreOpen" aria-haspopup="true">
              <span x-text="$t('nav.more')"></span>
              <svg class="w-3.5 h-3.5 transition-transform" :class="moreOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
              </svg>
            </button>
            <div x-show="moreOpen" x-transition class="absolute top-full right-0 rtl:right-auto rtl:left-0 mt-2 w-48 rounded-md border border-parchment-dark bg-white py-1 shadow-lg z-50">
              <template x-for="link in moreLinks" :key="link.path">
                <a :href="link.path" @click.prevent="navigate(link.path)"
                   class="block px-4 py-2 text-sm text-ink-light hover:text-pevo-teal hover:bg-pevo-teal-light no-underline transition-colors"
                   x-text="link.label"></a>
              </template>
            </div>
          </div>
        </nav>

        <!-- Auth + Language Controls (Desktop) -->
        <div class="hidden md:flex items-center gap-3">
          <!-- Language Switcher -->
          <div class="relative" @click.outside="langOpen = false">
            <button type="button" @click="langOpen = !langOpen"
                    class="rounded-md border border-parchment-dark bg-white px-2 py-1 text-xs text-ink focus:outline-none focus:ring-1 focus:ring-pevo-teal"
                    aria-label="Language" :aria-expanded="langOpen" aria-haspopup="listbox">
              <span x-text="localeName(currentLocale)"></span>
              <span class="ml-1">&#9662;</span>
            </button>
            <div x-show="langOpen" x-transition role="listbox" aria-label="Language"
                 class="absolute end-0 z-50 mt-1 grid w-64 grid-cols-2 gap-1 rounded-md border border-parchment-dark bg-white p-2 shadow-lg">
              <template x-for="loc in locales" :key="loc">
                <button type="button" role="option" :aria-selected="loc === currentLocale"
                        @click="selectLocale(loc)"
                        class="rounded px-3 py-1.5 text-start text-xs whitespace-nowrap"
                        :class="loc === currentLocale ? 'bg-pevo-teal/10 font-medium text-pevo-teal' : 'text-ink hover:bg-parchment'"
                        x-text="localeName(loc)"></button>
              </template>
            </div>
          </div>

          <!-- Auth state -->
          <template x-if="$store.auth.isLoading">
            <span class="text-sm text-ink-muted" x-text="$t('header.loading')"></span>
          </template>
          <template x-if="!$store.auth.isLoading && $store.auth.isConnected">
            <div class="relative" @click.outside="userMenuOpen = false">
              <!-- User menu trigger: bell + @username + chevron -->
              <button class="flex items-center gap-2 rounded-md border border-parchment-dark bg-white px-2.5 py-1.5 text-sm font-medium text-ink hover:border-pevo-teal transition-colors"
                      @click="toggleUserMenu()" :aria-expanded="userMenuOpen" aria-haspopup="true" :aria-label="$t('aria.notifications')">
                <span class="relative">
                  <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                  </svg>
                  <span x-show="$store.notifications.unreadCount > 0" aria-live="polite"
                        class="absolute -top-1.5 -right-1.5 flex h-3.5 min-w-[0.875rem] items-center justify-center rounded-full bg-pevo-crimson px-0.5 text-[9px] font-bold text-white"
                        x-text="$store.notifications.unreadCount > 99 ? '99+' : $store.notifications.unreadCount"></span>
                </span>
                <span x-text="'@' + $store.auth.username"></span>
                <svg class="w-3.5 h-3.5 transition-transform" :class="userMenuOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                </svg>
              </button>
              <!-- User menu dropdown -->
              <div x-show="userMenuOpen" x-transition class="absolute right-0 rtl:right-auto rtl:left-0 top-full mt-2 w-80 rounded-lg border border-parchment-dark bg-white shadow-lg z-50">
                <!-- Profile link -->
                <a :href="$lp('/profile/' + $store.auth.username)"
                   @click.prevent="navigate('/profile/' + $store.auth.username); userMenuOpen = false"
                   class="flex items-center gap-2 px-4 py-3 text-sm font-medium text-pevo-teal no-underline hover:bg-pevo-teal-light transition-colors rounded-t-lg">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
                  <span x-text="'@' + $store.auth.username"></span>
                </a>
                <a :href="$lp('/settings')"
                   @click.prevent="navigate('/settings'); userMenuOpen = false"
                   class="flex items-center gap-2 px-4 py-2.5 text-sm text-ink-light no-underline hover:bg-pevo-teal-light transition-colors">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  <span x-text="$t('settings.title')"></span>
                </a>
                <div class="border-t border-parchment-dark"></div>
                <!-- Notifications section -->
                <div class="px-4 py-3 max-h-64 overflow-auto">
                  <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-semibold text-ink" x-text="$t('notifications.title')"></h3>
                    <button x-show="$store.notifications.unreadCount > 0"
                            class="text-xs text-pevo-teal hover:text-pevo-teal-dark font-medium"
                            @click="$store.notifications.markAllRead()"
                            x-text="$t('notifications.markAllRead')"></button>
                  </div>
                  <p x-show="$store.notifications.events.length === 0" class="text-sm text-ink-muted" x-text="$t('notifications.empty')"></p>
                  <template x-for="(event, i) in $store.notifications.events" :key="i">
                    <div class="py-2 border-b border-parchment text-sm text-ink-light" x-text="formatNotification(event)"></div>
                  </template>
                </div>
                <div class="border-t border-parchment-dark"></div>
                <!-- Disconnect -->
                <button class="w-full px-4 py-2.5 text-sm text-ink-muted hover:text-pevo-crimson hover:bg-pevo-crimson-light transition-colors rounded-b-lg text-left rtl:text-right"
                        @click="handleDisconnect(); userMenuOpen = false" x-text="$t('header.disconnect')"></button>
              </div>
            </div>
          </template>
          <template x-if="!$store.auth.isLoading && !$store.auth.isConnected">
            <button class="btn-primary text-sm" @click="handleSignIn()" x-text="$t('signIn.signInButton')"></button>
          </template>
        </div>

        <!-- Mobile menu button -->
        <button class="md:hidden p-2 text-ink-muted hover:text-ink"
                @click="mobileMenuOpen = !mobileMenuOpen"
                :aria-label="$t('aria.toggleMenu')" :aria-expanded="mobileMenuOpen">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
      </div>

      <!-- Mobile Navigation -->
      <nav x-show="mobileMenuOpen" x-transition aria-label="Mobile navigation" class="md:hidden border-t border-parchment-dark py-4 space-y-2">
        <template x-for="link in allLinks" :key="link.path">
          <a :href="link.path" @click.prevent="navigate(link.path)"
             class="block px-2 py-2 text-sm font-medium text-ink-light hover:text-pevo-teal hover:bg-pevo-teal-light rounded no-underline"
             x-text="link.label"></a>
        </template>
        <!-- Mobile language switcher -->
        <div class="pt-2 px-2 flex items-center gap-2 mb-2">
          <div class="relative" @click.outside="langOpen = false">
            <button type="button" @click="langOpen = !langOpen"
                    class="rounded-md border border-parchment-dark bg-white px-2 py-1 text-xs text-ink focus:outline-none focus:ring-1 focus:ring-pevo-teal">
              <span x-text="localeName(currentLocale)"></span>
              <span class="ml-1">&#9662;</span>
            </button>
            <div x-show="langOpen" x-transition
                 class="absolute start-0 z-50 mt-1 grid w-64 grid-cols-2 gap-1 rounded-md border border-parchment-dark bg-white p-2 shadow-lg">
              <template x-for="loc in locales" :key="loc">
                <button type="button" @click="selectLocale(loc)"
                        class="rounded px-3 py-1.5 text-start text-xs whitespace-nowrap"
                        :class="loc === currentLocale ? 'bg-pevo-teal/10 font-medium text-pevo-teal' : 'text-ink hover:bg-parchment'"
                        x-text="localeName(loc)"></button>
              </template>
            </div>
          </div>
        </div>
        <!-- Mobile auth -->
        <div class="pt-2 px-2">
          <template x-if="$store.auth.isLoading">
            <span class="text-sm text-ink-muted" x-text="$t('header.loading')"></span>
          </template>
          <template x-if="!$store.auth.isLoading && $store.auth.isConnected">
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <a :href="$lp('/profile/' + $store.auth.username)"
                   @click.prevent="navigate('/profile/' + $store.auth.username)"
                   class="text-sm font-medium text-pevo-teal no-underline"
                   x-text="'@' + $store.auth.username"></a>
              </div>
              <a :href="$lp('/settings')"
                 @click.prevent="navigate('/settings')"
                 class="block text-sm text-ink-light no-underline hover:text-pevo-teal transition-colors" x-text="$t('settings.title')"></a>
              <button class="btn-secondary text-sm w-full" @click="handleDisconnect()" x-text="$t('header.disconnect')"></button>
            </div>
          </template>
          <template x-if="!$store.auth.isLoading && !$store.auth.isConnected">
            <button class="btn-primary text-sm w-full" @click="handleSignIn()" x-text="$t('signIn.signInButton')"></button>
          </template>
        </div>
      </nav>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════ MAIN CONTENT ═══════════════════════════════════════════════ -->
  <main x-data="pageMount" class="flex-1">
  </main>

  <!-- ═══════════ BROADCAST CONFIRM MODAL (light accounts) ═══════════ -->
  <div x-data x-show="$store.broadcastConfirm.open" x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
       @keydown.escape.window="$store.broadcastConfirm.cancel()">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full mx-4 p-6"
         @click.outside="$store.broadcastConfirm.cancel()">
      <h3 class="text-lg font-bold text-ink mb-2" x-text="$store.broadcastConfirm.title"></h3>
      <p class="text-sm text-ink-muted mb-6" x-text="$store.broadcastConfirm.message"></p>
      <div class="flex gap-3 justify-end">
        <button @click="$store.broadcastConfirm.cancel()"
                class="px-4 py-2 text-sm font-medium text-ink-muted hover:text-ink border border-parchment-dark rounded-lg"
                x-text="$t('common.cancel')"></button>
        <button @click="$store.broadcastConfirm.confirm()"
                class="px-4 py-2 text-sm font-medium text-white bg-pevo-teal hover:bg-pevo-teal-dark rounded-lg"
                x-text="$store.broadcastConfirm.confirmLabel"></button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════ FOOTER ═══════════════════════════════════════════════ -->
  <footer x-data="footer" class="border-t border-parchment-dark bg-white mt-auto">
    <div class="container-narrow py-8">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-8">
        <!-- Brand -->
        <div>
          <div class="flex items-center gap-2 mb-3">
            <img src="/images/pevo-logo.png" :alt="$t('aria.pevoLogo')" width="28" height="28" class="rounded-sm" />
            <span class="text-lg font-bold text-ink">pevo</span>
          </div>
          <p class="text-sm text-ink-muted leading-relaxed" x-text="$t('footer.description')"></p>
          <p class="text-xs text-pevo-teal mt-2 font-medium" x-text="$t('footer.tagline')"></p>
        </div>

        <!-- Links -->
        <div>
          <p class="font-sans text-sm font-semibold text-ink mb-3" x-text="$t('footer.platform')"></p>
          <ul class="space-y-2 text-sm">
            <li><a :href="$lp('/')" @click.prevent="navigate('/')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.paperFeed')"></a></li>
            <li><a :href="$lp('/publish')" @click.prevent="navigate('/publish')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.publishPaper')"></a></li>
            <li><a :href="$lp('/accreditation')" @click.prevent="navigate('/accreditation')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('nav.accreditation')"></a></li>
            <li><a :href="$lp('/about')" @click.prevent="navigate('/about')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.aboutPevo')"></a></li>
            <li><a :href="$lp('/getting-started')" @click.prevent="navigate('/getting-started')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.gettingStarted')"></a></li>
            <li><a :href="$lp('/faq')" @click.prevent="navigate('/faq')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.faq')"></a></li>
            <li><a :href="$lp('/blog')" @click.prevent="navigate('/blog')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('nav.blog')"></a></li>
            <li><a :href="$lp('/contact')" @click.prevent="navigate('/contact')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.contact')"></a></li>
          </ul>
        </div>

        <!-- Resources -->
        <div>
          <p class="font-sans text-sm font-semibold text-ink mb-3" x-text="$t('footer.resources')"></p>
          <ul class="space-y-2 text-sm">
            <li x-show="githubUrl"><a :href="githubUrl" target="_blank" rel="noopener noreferrer" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.github')"></a></li>
            <li><a href="https://hive.io" target="_blank" rel="noopener noreferrer" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.hiveNetwork')"></a></li>
            <li><a href="https://hive-keychain.com/" target="_blank" rel="noopener noreferrer" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.hiveKeychain')"></a></li>
            <li x-show="discordUrl"><a :href="discordUrl" target="_blank" rel="noopener noreferrer" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.discord')"></a></li>
          </ul>
        </div>
      </div>

      <!-- Bottom bar -->
      <div class="mt-8 pt-4 border-t border-parchment-dark flex flex-col sm:flex-row items-center justify-between gap-2">
        <p class="text-xs text-ink-muted" x-text="$t('footer.license')"></p>
        <a href="https://hive.io" target="_blank" rel="noopener noreferrer"
           class="flex items-center gap-1.5 text-xs text-ink-muted hover:text-pevo-teal no-underline">
          <img src="/images/hive-logo.svg" :alt="$t('aria.hiveLogo')" width="16" height="16" style="width:16px;height:auto" />
          Powered by Hive
        </a>
        <p class="text-xs text-ink-muted">pevo.science</p>
      </div>
    </div>
    <!-- Bottom brand bar -->
    <div class="h-1 bg-linear-to-r from-pevo-green via-pevo-teal to-pevo-crimson"></div>
  </footer>

  <!-- ═══════════════════════════════════════════════ USERNAME MODAL ═══════════════════════════════════ -->
  <div x-data="signInModal">
    <template x-if="open">
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
           @click="handleBackdropClick($event)" @keydown.window="handleKeydown($event)"
           role="dialog" aria-modal="true" aria-labelledby="signin-modal-title">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4 p-6">

          <!-- Mode: choose -->
          <template x-if="mode === 'choose'">
            <div>
              <h2 id="signin-modal-title" class="text-lg font-semibold text-ink mb-6" x-text="$t('signIn.title')"></h2>

              <!-- Email/password option -->
              <button type="button" class="w-full text-left p-4 rounded-lg border border-parchment-dark hover:border-pevo-teal hover:bg-pevo-teal-light/20 transition-colors mb-3"
                      @click="mode = 'email'">
                <div class="flex items-center gap-3">
                  <svg class="h-6 w-6 text-pevo-teal shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                  </svg>
                  <div>
                    <p class="font-medium text-ink text-sm" x-text="$t('signIn.emailOption')"></p>
                    <p class="text-xs text-ink-muted mt-0.5" x-text="$t('signIn.emailDescription')"></p>
                  </div>
                </div>
              </button>

              <!-- Keychain option -->
              <button type="button" class="w-full text-left p-4 rounded-lg border border-parchment-dark hover:border-pevo-teal hover:bg-pevo-teal-light/20 transition-colors"
                      @click="mode = 'keychain'">
                <div class="flex items-center gap-3">
                  <svg class="h-6 w-6 text-pevo-teal shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
                  </svg>
                  <div>
                    <p class="font-medium text-ink text-sm" x-text="$t('signIn.browserExtensionOption')"></p>
                    <p class="text-xs text-ink-muted mt-0.5" x-text="$t('signIn.browserExtensionDescription')"></p>
                  </div>
                </div>
              </button>

              <p class="text-sm text-ink/60 mt-4 text-center">
                <span x-text="$t('common.noAccount')"></span>
                <a :href="$lp('/signup')" class="text-pevo-teal hover:underline font-medium"
                   @click.prevent="cancel(); $store.router.navigate('/signup')" x-text="$t('common.signUp')"></a>
              </p>

              <div class="flex justify-end mt-4">
                <button type="button" class="btn-secondary text-sm px-4 py-2" @click="cancel()" x-text="$t('common.cancel')"></button>
              </div>
            </div>
          </template>

          <!-- Mode: email login -->
          <template x-if="mode === 'email'">
            <div>
              <button type="button" class="text-sm text-ink-muted hover:text-ink mb-4 flex items-center gap-1" @click="mode = 'choose'; emailError = null">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
                <span x-text="$t('signIn.back')"></span>
              </button>
              <h2 class="text-lg font-semibold text-ink mb-4" x-text="$t('signIn.emailTitle')"></h2>

              <label class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('login.emailOrUsername')"></label>
              <input type="text" x-model="emailValue" x-ref="emailInput"
                     class="w-full px-3 py-2 border border-parchment-dark rounded-md text-sm text-ink focus:outline-none focus:ring-2 focus:ring-pevo-teal focus:border-transparent mb-3"
                     @input="emailError = null"
                     @keydown.enter="handleEmailLogin()" />

              <label class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('login.password')"></label>
              <input type="password" x-model="passwordValue"
                     class="w-full px-3 py-2 border border-parchment-dark rounded-md text-sm text-ink focus:outline-none focus:ring-2 focus:ring-pevo-teal focus:border-transparent"
                     @keydown.enter="handleEmailLogin()" />

              <template x-if="emailError">
                <p class="text-sm text-pevo-crimson mt-2" x-text="emailError"></p>
              </template>

              <p class="text-xs text-ink-muted mt-3">
                <a :href="$lp('/reset-password')" class="text-pevo-teal hover:underline"
                   @click.prevent="cancel(); $store.router.navigate('/reset-password')" x-text="$t('login.forgotPassword')"></a>
              </p>

              <div class="flex justify-end gap-3 mt-5">
                <button type="button" class="btn-secondary text-sm px-4 py-2" @click="cancel()" x-text="$t('common.cancel')"></button>
                <button type="button" class="btn-primary text-sm px-4 py-2" :disabled="emailLoading" @click="handleEmailLogin()">
                  <span x-show="!emailLoading" x-text="$t('signIn.signInButton')"></span>
                  <span x-show="emailLoading" x-text="$t('signIn.signingIn')"></span>
                </button>
              </div>
            </div>
          </template>

          <!-- Mode: unverified email -->
          <template x-if="mode === 'unverified'">
            <div>
              <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-4">
                <p class="text-amber-800 text-sm" x-text="$t('login.pendingUnverified')"></p>
              </div>
              <template x-if="resendSuccess">
                <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                  <p class="text-green-700 text-sm" x-text="$t('login.verificationResent')"></p>
                </div>
              </template>
              <div class="flex justify-end gap-3 mt-4">
                <button type="button" class="btn-secondary text-sm px-4 py-2" @click="cancel()" x-text="$t('common.cancel')"></button>
                <button x-show="!resendSuccess" type="button" class="btn-primary text-sm px-4 py-2" :disabled="isResending" @click="handleResendVerification()">
                  <span x-show="!isResending" x-text="$t('login.resendVerification')"></span>
                  <span x-show="isResending" x-text="$t('login.resending')"></span>
                </button>
              </div>
            </div>
          </template>

          <!-- Mode: keychain -->
          <template x-if="mode === 'keychain'">
            <div>
              <button type="button" class="text-sm text-ink-muted hover:text-ink mb-4 flex items-center gap-1" @click="mode = 'choose'; error = null">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
                <span x-text="$t('signIn.back')"></span>
              </button>
              <h2 class="text-lg font-semibold text-ink mb-4" x-text="$t('signIn.browserExtensionTitle')"></h2>

              <template x-if="!$store.auth.isKeychainInstalled">
                <div class="text-center py-4">
                  <p class="text-sm text-ink-muted mb-3" x-text="$t('signIn.browserExtensionNotInstalled')"></p>
                  <a href="https://hive-keychain.com/" target="_blank" rel="noopener noreferrer"
                     class="btn-primary text-sm no-underline" x-text="$t('header.installBrowserExtension')"></a>
                </div>
              </template>

              <template x-if="$store.auth.isKeychainInstalled">
                <div>
                  <label for="keychain-username-input" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('signIn.hiveUsername')"></label>
                  <input id="keychain-username-input" x-ref="keychainInput" type="text"
                         class="w-full px-3 py-2 border border-parchment-dark rounded-md text-sm text-ink focus:outline-none focus:ring-2 focus:ring-pevo-teal focus:border-transparent"
                         :placeholder="$t('signIn.usernamePlaceholder')"
                         x-model="value"
                         @input="error = null"
                         @keydown.enter="confirm()" />

                  <template x-if="error">
                    <p class="text-sm text-pevo-crimson mt-2" x-text="error"></p>
                  </template>

                  <div class="flex justify-end gap-3 mt-5">
                    <button type="button" class="btn-secondary text-sm px-4 py-2" @click="cancel()" x-text="$t('common.cancel')"></button>
                    <button type="button" class="btn-primary text-sm px-4 py-2" @click="confirm()" x-text="$t('signIn.connect')"></button>
                  </div>
                </div>
              </template>
            </div>
          </template>

        </div>
      </div>
    </template>
  </div>

  <!-- ═══════════════════════════════════════════════ TOAST ═══════════════════════════════════════════════ -->
  <div class="fixed bottom-4 right-4 z-50 flex flex-col-reverse gap-2 max-w-sm w-full pointer-events-none" aria-live="polite">
    <template x-for="item in $store.toast.items" :key="item.id">
      <div class="pointer-events-auto flex items-start gap-3 rounded-lg border px-4 py-3 shadow-md transition-all duration-300"
           :class="{
             'border-pevo-crimson/40 bg-pevo-crimson-light text-ink': item.type === 'error',
             'border-pevo-green/40 bg-pevo-green-light text-ink': item.type === 'success',
             'border-pevo-teal/40 bg-pevo-teal-light text-ink': item.type === 'info',
             'opacity-0 translate-x-4': item.removing,
             'opacity-100 translate-x-0': !item.removing,
           }"
           role="alert">
        <!-- Icon -->
        <span :class="{
          'text-pevo-crimson': item.type === 'error',
          'text-pevo-green': item.type === 'success',
          'text-pevo-teal': item.type === 'info',
        }">
          <template x-if="item.type === 'error'">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
            </svg>
          </template>
          <template x-if="item.type === 'success'">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
            </svg>
          </template>
          <template x-if="item.type === 'info'">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd" />
            </svg>
          </template>
        </span>
        <p class="text-sm flex-1" x-text="item.message"></p>
        <button @click="$store.toast.dismiss(item.id)"
                class="shrink-0 text-ink-muted hover:text-ink transition-colors p-0.5" :aria-label="$t('aria.dismiss')">
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </template>
  </div>

</body>
</html>
