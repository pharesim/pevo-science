<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEvO - Open Scientific Publishing</title>
  <meta name="description" content="Open scientific publication and interactive peer evaluation on a permanent, open record. Non-profit, transparent, forkable." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <script type="module" src="/src/main.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-parchment text-ink">

  <!-- ═══════════════════════════════════════════════ HEADER ═══════════════════════════════════════════════ -->
  <header x-data="header" class="border-b border-parchment-dark bg-white">
    <!-- Brand accent bar -->
    <div class="h-1 bg-gradient-to-r rtl:bg-gradient-to-l from-pevo-green via-pevo-teal to-pevo-crimson"></div>

    <div class="container-narrow">
      <div class="flex h-16 items-center justify-between">
        <!-- Logo -->
        <a href="/" @click.prevent="navigate('/')" class="flex items-center gap-2.5 no-underline">
          <img src="/images/pevo-logo.png" alt="PEvO logo" width="36" height="36" class="rounded-sm" />
          <div class="flex flex-col">
            <span class="text-lg font-bold text-ink leading-tight tracking-tight">pevo</span>
            <span class="hidden sm:block text-[10px] text-ink-muted leading-tight" x-text="$t('header.tagline')"></span>
          </div>
        </a>

        <!-- Desktop Navigation -->
        <nav aria-label="Main navigation" class="hidden md:flex items-center gap-6">
          <template x-for="link in primaryLinks" :key="link.path">
            <a :href="link.path" @click.prevent="navigate(link.path)"
               class="text-sm font-medium text-ink-light hover:text-pevo-teal no-underline transition-colors"
               x-text="link.label"></a>
          </template>
          <!-- More dropdown -->
          <div class="relative" @click.outside="moreOpen = false">
            <button class="text-sm font-medium text-ink-light hover:text-pevo-teal transition-colors flex items-center gap-1"
                    @click="moreOpen = !moreOpen" :aria-expanded="moreOpen" aria-haspopup="true">
              <span x-text="$t('nav.more')"></span>
              <svg class="w-3.5 h-3.5 transition-transform" :class="moreOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
              </svg>
            </button>
            <div x-show="moreOpen" x-transition class="absolute top-full right-0 rtl:right-auto rtl:left-0 mt-2 w-48 rounded-md border border-parchment-dark bg-white py-1 shadow-lg z-50">
              <template x-for="link in moreLinks" :key="link.path">
                <a :href="link.path" @click.prevent="navigate(link.path)"
                   class="block px-4 py-2 text-sm text-ink-light hover:text-pevo-teal hover:bg-pevo-teal-light no-underline transition-colors"
                   x-text="link.label"></a>
              </template>
            </div>
          </div>
        </nav>

        <!-- Auth + Language Controls (Desktop) -->
        <div class="hidden md:flex items-center gap-3">
          <!-- Language Switcher -->
          <div class="relative" @click.outside="langOpen = false">
            <button type="button" @click="langOpen = !langOpen"
                    class="rounded-md border border-parchment-dark bg-white px-2 py-1 text-xs text-ink focus:outline-none focus:ring-1 focus:ring-pevo-teal"
                    aria-label="Language" :aria-expanded="langOpen" aria-haspopup="listbox">
              <span x-text="localeName(currentLocale)"></span>
              <span class="ml-1">&#9662;</span>
            </button>
            <div x-show="langOpen" x-transition role="listbox" aria-label="Language"
                 class="absolute end-0 z-50 mt-1 grid w-64 grid-cols-2 gap-1 rounded-md border border-parchment-dark bg-white p-2 shadow-lg">
              <template x-for="loc in locales" :key="loc">
                <button type="button" role="option" :aria-selected="loc === currentLocale"
                        @click="selectLocale(loc)"
                        class="rounded px-3 py-1.5 text-start text-xs whitespace-nowrap"
                        :class="loc === currentLocale ? 'bg-pevo-teal/10 font-medium text-pevo-teal' : 'text-ink hover:bg-parchment'"
                        x-text="localeName(loc)"></button>
              </template>
            </div>
          </div>

          <!-- Auth state -->
          <template x-if="$store.auth.isLoading">
            <span class="text-sm text-ink-muted" x-text="$t('header.loading')"></span>
          </template>
          <template x-if="!$store.auth.isLoading && !$store.auth.isKeychainInstalled">
            <a href="https://hive-keychain.com/" target="_blank" rel="noopener noreferrer"
               class="btn-secondary text-sm no-underline" x-text="$t('header.installKeychain')"></a>
          </template>
          <template x-if="!$store.auth.isLoading && $store.auth.isKeychainInstalled && $store.auth.isConnected">
            <div class="relative" @click.outside="userMenuOpen = false">
              <!-- User menu trigger: bell + @username + chevron -->
              <button class="flex items-center gap-2 rounded-md border border-parchment-dark bg-white px-2.5 py-1.5 text-sm font-medium text-ink hover:border-pevo-teal transition-colors"
                      @click="toggleUserMenu()" :aria-expanded="userMenuOpen" aria-haspopup="true" :aria-label="$t('aria.notifications')">
                <span class="relative">
                  <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                  </svg>
                  <span x-show="$store.notifications.unreadCount > 0" aria-live="polite"
                        class="absolute -top-1.5 -right-1.5 flex h-3.5 min-w-[0.875rem] items-center justify-center rounded-full bg-pevo-crimson px-0.5 text-[9px] font-bold text-white"
                        x-text="$store.notifications.unreadCount > 99 ? '99+' : $store.notifications.unreadCount"></span>
                </span>
                <span x-text="'@' + $store.auth.username"></span>
                <svg class="w-3.5 h-3.5 transition-transform" :class="userMenuOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                </svg>
              </button>
              <!-- User menu dropdown -->
              <div x-show="userMenuOpen" x-transition class="absolute right-0 rtl:right-auto rtl:left-0 top-full mt-2 w-80 rounded-lg border border-parchment-dark bg-white shadow-lg z-50">
                <!-- Profile link -->
                <a :href="'/profile/' + $store.auth.username"
                   @click.prevent="navigate('/profile/' + $store.auth.username); userMenuOpen = false"
                   class="flex items-center gap-2 px-4 py-3 text-sm font-medium text-pevo-teal no-underline hover:bg-pevo-teal-light transition-colors rounded-t-lg">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
                  <span x-text="'@' + $store.auth.username"></span>
                </a>
                <div class="border-t border-parchment-dark"></div>
                <!-- Notifications section -->
                <div class="px-4 py-3 max-h-64 overflow-auto">
                  <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-semibold text-ink" x-text="$t('notifications.title')"></h3>
                    <button x-show="$store.notifications.unreadCount > 0"
                            class="text-xs text-pevo-teal hover:text-pevo-teal-dark font-medium"
                            @click="$store.notifications.markAllRead()"
                            x-text="$t('notifications.markAllRead')"></button>
                  </div>
                  <p x-show="$store.notifications.events.length === 0" class="text-sm text-ink-muted" x-text="$t('notifications.empty')"></p>
                  <template x-for="(event, i) in $store.notifications.events" :key="i">
                    <div class="py-2 border-b border-parchment text-sm text-ink-light" x-text="formatNotification(event)"></div>
                  </template>
                </div>
                <div class="border-t border-parchment-dark"></div>
                <!-- Disconnect -->
                <button class="w-full px-4 py-2.5 text-sm text-ink-muted hover:text-pevo-crimson hover:bg-pevo-crimson-light transition-colors rounded-b-lg text-left rtl:text-right"
                        @click="handleDisconnect(); userMenuOpen = false" x-text="$t('header.disconnect')"></button>
              </div>
            </div>
          </template>
          <template x-if="!$store.auth.isLoading && $store.auth.isKeychainInstalled && !$store.auth.isConnected">
            <button class="btn-primary text-sm" @click="handleConnect()" x-text="$t('header.connectWallet')"></button>
          </template>
        </div>

        <!-- Mobile menu button -->
        <button class="md:hidden p-2 text-ink-muted hover:text-ink"
                @click="mobileMenuOpen = !mobileMenuOpen"
                aria-label="Toggle navigation menu" :aria-expanded="mobileMenuOpen">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
      </div>

      <!-- Mobile Navigation -->
      <nav x-show="mobileMenuOpen" x-transition aria-label="Mobile navigation" class="md:hidden border-t border-parchment-dark py-4 space-y-2">
        <template x-for="link in allLinks" :key="link.path">
          <a :href="link.path" @click.prevent="navigate(link.path)"
             class="block px-2 py-2 text-sm font-medium text-ink-light hover:text-pevo-teal hover:bg-pevo-teal-light rounded no-underline"
             x-text="link.label"></a>
        </template>
        <!-- Mobile language switcher -->
        <div class="pt-2 px-2 flex items-center gap-2 mb-2">
          <div class="relative" @click.outside="langOpen = false">
            <button type="button" @click="langOpen = !langOpen"
                    class="rounded-md border border-parchment-dark bg-white px-2 py-1 text-xs text-ink focus:outline-none focus:ring-1 focus:ring-pevo-teal">
              <span x-text="localeName(currentLocale)"></span>
              <span class="ml-1">&#9662;</span>
            </button>
            <div x-show="langOpen" x-transition
                 class="absolute start-0 z-50 mt-1 grid w-64 grid-cols-2 gap-1 rounded-md border border-parchment-dark bg-white p-2 shadow-lg">
              <template x-for="loc in locales" :key="loc">
                <button type="button" @click="selectLocale(loc)"
                        class="rounded px-3 py-1.5 text-start text-xs whitespace-nowrap"
                        :class="loc === currentLocale ? 'bg-pevo-teal/10 font-medium text-pevo-teal' : 'text-ink hover:bg-parchment'"
                        x-text="localeName(loc)"></button>
              </template>
            </div>
          </div>
        </div>
        <!-- Mobile auth -->
        <div class="pt-2 px-2">
          <template x-if="$store.auth.isLoading">
            <span class="text-sm text-ink-muted" x-text="$t('header.loading')"></span>
          </template>
          <template x-if="!$store.auth.isLoading && !$store.auth.isKeychainInstalled">
            <a href="https://hive-keychain.com/" target="_blank" rel="noopener noreferrer"
               class="btn-secondary text-sm w-full block text-center no-underline" x-text="$t('header.installKeychain')"></a>
          </template>
          <template x-if="!$store.auth.isLoading && $store.auth.isKeychainInstalled && $store.auth.isConnected">
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <a :href="'/profile/' + $store.auth.username"
                   @click.prevent="navigate('/profile/' + $store.auth.username)"
                   class="text-sm font-medium text-pevo-teal no-underline"
                   x-text="'@' + $store.auth.username"></a>
              </div>
              <button class="btn-secondary text-sm w-full" @click="handleDisconnect()" x-text="$t('header.disconnect')"></button>
            </div>
          </template>
          <template x-if="!$store.auth.isLoading && $store.auth.isKeychainInstalled && !$store.auth.isConnected">
            <button class="btn-primary text-sm w-full" @click="handleConnect()" x-text="$t('header.connectWallet')"></button>
          </template>
        </div>
      </nav>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════ MAIN CONTENT ═══════════════════════════════════════════════ -->
  <main x-data class="flex-1">

    <!-- HOME -->
    <template x-if="$store.router.route === 'home'">
      <div x-data="homePage">
        <!-- Landing section for unauthenticated users -->
        <template x-if="!$store.auth.isConnected">
          <div>
            <!-- Hero -->
            <section class="relative bg-white border-b border-parchment-dark overflow-hidden">
              <div class="absolute inset-0 geo-pattern opacity-60"></div>
              <div class="container-narrow relative py-12 sm:py-16">
                <div class="flex flex-col sm:flex-row items-center gap-8">
                  <div class="flex-1">
                    <!-- x-html intentional: heroTitle uses <highlight> for styled emphasis -->
                    <h1 class="text-4xl sm:text-5xl font-bold text-ink mb-4 leading-tight" x-html="$t('common.heroTitle')"></h1>
                    <p class="text-lg text-ink-muted mb-6 max-w-lg" x-text="$t('common.heroDescription')"></p>
                    <div class="flex flex-wrap gap-3">
                      <a href="/papers" @click.prevent="navigate('/papers')" class="btn-primary no-underline" x-text="$t('landing.browsePapers')"></a>
                      <a href="/about" @click.prevent="navigate('/about')" class="btn-secondary no-underline" x-text="$t('home.learnMore')"></a>
                    </div>
                  </div>
                  <div class="shrink-0 hidden md:block">
                    <img src="/images/pevo-logo.png" alt="PEvO" width="160" height="160" class="opacity-90" />
                  </div>
                </div>
              </div>
            </section>

            <!-- How it works -->
            <div class="container-narrow py-10">
              <h2 class="text-2xl font-bold text-ink mb-6 text-center" x-text="$t('landing.howItWorksTitle')"></h2>
              <p class="text-ink-muted text-center mb-8 max-w-2xl mx-auto" x-text="$t('landing.howItWorksDescription')"></p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div class="card text-center">
                  <div class="flex items-center justify-center w-10 h-10 rounded-full bg-pevo-green text-white text-lg font-bold mx-auto mb-3">1</div>
                  <h3 class="text-lg font-semibold text-ink mb-2" x-text="$t('landing.step1Title')"></h3>
                  <p class="text-sm text-ink-muted" x-text="$t('landing.step1Description')"></p>
                </div>
                <div class="card text-center">
                  <div class="flex items-center justify-center w-10 h-10 rounded-full bg-pevo-teal text-white text-lg font-bold mx-auto mb-3">2</div>
                  <h3 class="text-lg font-semibold text-ink mb-2" x-text="$t('landing.step2Title')"></h3>
                  <p class="text-sm text-ink-muted" x-text="$t('landing.step2Description')"></p>
                </div>
                <div class="card text-center">
                  <div class="flex items-center justify-center w-10 h-10 rounded-full bg-pevo-crimson text-white text-lg font-bold mx-auto mb-3">3</div>
                  <h3 class="text-lg font-semibold text-ink mb-2" x-text="$t('landing.step3Title')"></h3>
                  <p class="text-sm text-ink-muted" x-text="$t('landing.step3Description')"></p>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Authenticated: paper feed -->
        <template x-if="$store.auth.isConnected">
          <div>
            <!-- Hero -->
            <section class="relative bg-white border-b border-parchment-dark overflow-hidden">
              <div class="absolute inset-0 geo-pattern opacity-60"></div>
              <div class="container-narrow relative py-12 sm:py-16">
                <div class="flex flex-col sm:flex-row items-center gap-8">
                  <div class="flex-1">
                    <!-- x-html intentional: heroTitle uses <highlight> for styled emphasis -->
                    <h1 class="text-4xl sm:text-5xl font-bold text-ink mb-4 leading-tight" x-html="$t('common.heroTitle')"></h1>
                    <p class="text-lg text-ink-muted mb-6 max-w-lg" x-text="$t('common.heroDescription')"></p>
                    <div class="flex flex-wrap gap-3">
                      <a href="/publish" @click.prevent="navigate('/publish')" class="btn-primary no-underline" x-text="$t('home.publishPaper')"></a>
                      <a href="/about" @click.prevent="navigate('/about')" class="btn-secondary no-underline" x-text="$t('home.learnMore')"></a>
                    </div>
                  </div>
                  <div class="shrink-0 hidden md:block">
                    <img src="/images/pevo-logo.png" alt="PEvO" width="160" height="160" class="opacity-90" />
                  </div>
                </div>
              </div>
            </section>

            <!-- Paper Feed -->
            <div class="container-narrow py-8">
              <div class="mb-6">
                <h2 class="text-2xl font-bold text-ink mb-1" x-text="$t('home.feedTitle')"></h2>
                <p class="text-sm text-ink-muted" x-text="$t('home.feedDescription')"></p>
              </div>

              <!-- Filters -->
              <div class="flex flex-col sm:flex-row gap-3 sm:items-center mb-6">
                <div class="flex-1 sm:max-w-xs">
                  <label for="home-discipline" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('filters.discipline')"></label>
                  <select id="home-discipline" class="select-control capitalize" x-model="discipline" @change="onDisciplineChange()">
                    <option value="" x-text="$t('filters.allDisciplines')"></option>
                    <template x-for="d in disciplines" :key="d.name">
                      <option :value="d.name" x-text="`${d.name} (${d.paper_count})`" class="capitalize"></option>
                    </template>
                  </select>
                </div>
                <div class="w-full sm:w-40">
                  <label for="home-source" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('filters.source')"></label>
                  <select id="home-source" class="select-control" x-model="sourceFilter" @change="onSourceChange()">
                    <option value="" x-text="$t('filters.allSources')"></option>
                    <option value="native" x-text="$t('filters.nativePapers')"></option>
                    <option value="bridge" x-text="$t('filters.preprints')"></option>
                  </select>
                </div>
                <div class="w-full sm:w-48">
                  <label for="home-sort" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('filters.sortBy')"></label>
                  <select id="home-sort" class="select-control" x-model="sortBy" @change="onSortChange()">
                    <option value="date" x-text="$t('filters.mostRecent')"></option>
                    <option value="votes" x-text="$t('filters.mostVotes')"></option>
                    <option value="reputation" x-text="$t('filters.authorReputation')"></option>
                  </select>
                </div>
              </div>

              <!-- Loading skeleton -->
              <template x-if="loading">
                <div class="space-y-4">
                  <template x-for="i in 3" :key="i">
                    <div class="card animate-pulse">
                      <div class="h-4 bg-parchment-warm rounded w-24 mb-3"></div>
                      <div class="h-6 bg-parchment-warm rounded w-3/4 mb-2"></div>
                      <div class="h-4 bg-parchment-warm rounded w-1/2 mb-3"></div>
                      <div class="h-4 bg-parchment-warm rounded w-full mb-2"></div>
                      <div class="h-4 bg-parchment-warm rounded w-5/6"></div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Error -->
              <template x-if="!loading && error">
                <div class="card text-center py-12">
                  <p class="text-ink-muted mb-4" x-text="error"></p>
                  <button class="btn-primary" @click="loadPapers()" x-text="$t('home.retry')"></button>
                </div>
              </template>

              <!-- Empty state -->
              <template x-if="!loading && !error && papers.length === 0">
                <div class="card text-center py-12">
                  <p class="text-ink-muted" x-text="$t('home.noPapersFound')"></p>
                </div>
              </template>

              <!-- Paper cards -->
              <template x-if="!loading && !error && papers.length > 0">
                <div>
                  <div class="space-y-4">
                    <template x-for="paper in papers" :key="paper.author + '/' + paper.permlink">
                      <article class="card hover:shadow-sm transition-shadow">
                        <!-- Header: discipline + source badge + date -->
                        <div class="flex items-center justify-between text-xs text-ink-muted mb-3">
                          <div class="flex items-center gap-2">
                            <span class="badge-discipline capitalize" x-text="paper.discipline"></span>
                            <template x-if="paper.source_type && paper.source_type !== 'native'">
                              <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wide bg-pevo-teal-light text-pevo-teal-dark border border-pevo-teal/20"
                                    x-text="paper.source_type === 'arxiv' ? 'arXiv' : 'DOI'"></span>
                            </template>
                          </div>
                          <time :datetime="paper.created" x-text="formatDate(paper.created)"></time>
                        </div>

                        <!-- Title -->
                        <h3 class="text-paper-title leading-snug mb-2">
                          <a :href="'/paper/' + paper.author + '/' + paper.permlink"
                             @click.prevent="navigate('/paper/' + paper.author + '/' + paper.permlink)"
                             class="text-ink hover:text-pevo-teal no-underline" x-text="paper.title"></a>
                        </h3>

                        <!-- Authors -->
                        <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mb-3">
                          <p class="text-sm text-ink-light" x-text="paper.authors.map(a => a.name).join(', ')"></p>
                          <template x-if="paper.is_accredited">
                            <span class="badge-accredited" :title="$t('badge.accreditedTitle')">
                              <svg class="mr-1 h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd" d="M16.403 12.652a3 3 0 010-5.304 3 3 0 00-3.75-3.751 3 3 0 00-5.305 0 3 3 0 00-3.751 3.75 3 3 0 000 5.305 3 3 0 003.75 3.751 3 3 0 005.305 0 3 3 0 003.751-3.75zm-2.546-4.46a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                              </svg>
                              <span x-text="$t('badge.accredited')"></span>
                            </span>
                          </template>
                        </div>

                        <!-- Abstract preview -->
                        <p class="text-sm text-ink-muted leading-relaxed mb-4" x-text="truncateText(paper.abstract)"></p>

                        <!-- Keywords -->
                        <template x-if="paper.keywords && paper.keywords.length > 0">
                          <div class="flex flex-wrap gap-1.5 mb-4">
                            <template x-for="kw in paper.keywords" :key="kw">
                              <span class="text-xs px-2 py-0.5 rounded-full bg-parchment-warm text-ink-muted" x-text="kw"></span>
                            </template>
                          </div>
                        </template>

                        <!-- Metrics -->
                        <div class="flex items-center gap-5 text-xs text-ink-muted pt-3 border-t border-parchment-dark">
                          <span class="flex items-center gap-1" title="Reviews">
                            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zm-5 0H8v2h2V9z" clip-rule="evenodd" /></svg>
                            <span x-text="(paper.review_count ?? 0) + ' '"></span>
                          </span>
                          <span class="flex items-center gap-1" title="Citations">
                            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V14a1 1 0 11-2 0V4.804z" /></svg>
                            <span x-text="paper.citation_count ?? 0"></span>
                          </span>
                          <template x-if="paper.ipfs_cid">
                            <span class="flex items-center gap-1 ml-auto rtl:ml-0 rtl:mr-auto" title="PDF">
                              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" /></svg>
                              <span x-text="$t('paperCard.pdf')"></span>
                            </span>
                          </template>
                        </div>
                      </article>
                    </template>
                  </div>

                  <!-- Pagination -->
                  <template x-if="totalPages > 1">
                    <nav class="flex items-center justify-center gap-1 mt-8" aria-label="Pagination">
                      <button class="btn-secondary px-3 py-1.5 text-sm" :disabled="currentPage === 1" @click="goToPage(currentPage - 1)" x-text="$t('pagination.previous')"></button>
                      <template x-for="(page, i) in paginationPages" :key="'p' + i">
                        <template x-if="page === '...'">
                          <span class="px-2 py-1 text-sm text-ink-muted">...</span>
                        </template>
                      </template>
                      <template x-for="(page, i) in paginationPages" :key="'n' + i">
                        <template x-if="page !== '...'">
                          <button class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors"
                                  :class="page === currentPage ? 'bg-pevo-teal text-white' : 'text-ink-light hover:bg-parchment-warm'"
                                  :aria-current="page === currentPage ? 'page' : false"
                                  @click="goToPage(page)" x-text="page"></button>
                        </template>
                      </template>
                      <button class="btn-secondary px-3 py-1.5 text-sm" :disabled="currentPage === totalPages" @click="goToPage(currentPage + 1)" x-text="$t('pagination.next')"></button>
                    </nav>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- PAPERS (public feed) -->
    <template x-if="$store.router.route === 'papers'">
      <div x-data="homePage">
        <div class="container-narrow py-8">
          <div class="mb-6">
            <h2 class="text-2xl font-bold text-ink mb-1" x-text="$t('home.feedTitle')"></h2>
            <p class="text-sm text-ink-muted" x-text="$t('home.feedDescription')"></p>
          </div>

          <!-- Filters -->
          <div class="flex flex-col sm:flex-row gap-3 sm:items-center mb-6">
            <div class="flex-1 sm:max-w-xs">
              <label for="papers-discipline" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('filters.discipline')"></label>
              <select id="papers-discipline" class="select-control capitalize" x-model="discipline" @change="onDisciplineChange()">
                <option value="" x-text="$t('filters.allDisciplines')"></option>
                <template x-for="d in disciplines" :key="d.name">
                  <option :value="d.name" x-text="`${d.name} (${d.paper_count})`" class="capitalize"></option>
                </template>
              </select>
            </div>
            <div class="w-full sm:w-40">
              <label for="papers-source" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('filters.source')"></label>
              <select id="papers-source" class="select-control" x-model="sourceFilter" @change="onSourceChange()">
                <option value="" x-text="$t('filters.allSources')"></option>
                <option value="native" x-text="$t('filters.nativePapers')"></option>
                <option value="bridge" x-text="$t('filters.preprints')"></option>
              </select>
            </div>
            <div class="w-full sm:w-48">
              <label for="papers-sort" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('filters.sortBy')"></label>
              <select id="papers-sort" class="select-control" x-model="sortBy" @change="onSortChange()">
                <option value="date" x-text="$t('filters.mostRecent')"></option>
                <option value="votes" x-text="$t('filters.mostVotes')"></option>
                <option value="reputation" x-text="$t('filters.authorReputation')"></option>
              </select>
            </div>
          </div>

          <!-- Loading skeleton -->
          <template x-if="loading">
            <div class="space-y-4">
              <template x-for="i in 3" :key="i">
                <div class="card animate-pulse">
                  <div class="h-4 bg-parchment-warm rounded w-24 mb-3"></div>
                  <div class="h-6 bg-parchment-warm rounded w-3/4 mb-2"></div>
                  <div class="h-4 bg-parchment-warm rounded w-1/2 mb-3"></div>
                  <div class="h-4 bg-parchment-warm rounded w-full mb-2"></div>
                  <div class="h-4 bg-parchment-warm rounded w-5/6"></div>
                </div>
              </template>
            </div>
          </template>

          <!-- Error -->
          <template x-if="!loading && error">
            <div class="card text-center py-12">
              <p class="text-ink-muted mb-4" x-text="error"></p>
              <button class="btn-primary" @click="loadPapers()" x-text="$t('home.retry')"></button>
            </div>
          </template>

          <!-- Empty state -->
          <template x-if="!loading && !error && papers.length === 0">
            <div class="card text-center py-12">
              <p class="text-ink-muted" x-text="$t('home.noPapersFound')"></p>
            </div>
          </template>

          <!-- Paper cards -->
          <template x-if="!loading && !error && papers.length > 0">
            <div>
              <div class="space-y-4">
                <template x-for="paper in papers" :key="paper.author + '/' + paper.permlink">
                  <article class="card hover:shadow-sm transition-shadow">
                    <!-- Header: discipline + source badge + date -->
                    <div class="flex items-center justify-between text-xs text-ink-muted mb-3">
                      <div class="flex items-center gap-2">
                        <span class="badge-discipline capitalize" x-text="paper.discipline"></span>
                        <template x-if="paper.source_type && paper.source_type !== 'native'">
                          <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wide bg-pevo-teal-light text-pevo-teal-dark border border-pevo-teal/20"
                                x-text="paper.source_type === 'arxiv' ? 'arXiv' : 'DOI'"></span>
                        </template>
                      </div>
                      <time :datetime="paper.created" x-text="formatDate(paper.created)"></time>
                    </div>

                    <!-- Title -->
                    <h3 class="text-paper-title leading-snug mb-2">
                      <a :href="'/paper/' + paper.author + '/' + paper.permlink"
                         @click.prevent="navigate('/paper/' + paper.author + '/' + paper.permlink)"
                         class="text-ink hover:text-pevo-teal no-underline" x-text="paper.title"></a>
                    </h3>

                    <!-- Authors -->
                    <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mb-3">
                      <p class="text-sm text-ink-light" x-text="paper.authors.map(a => a.name).join(', ')"></p>
                      <template x-if="paper.is_accredited">
                        <span class="badge-accredited" :title="$t('badge.accreditedTitle')">
                          <svg class="mr-1 h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M16.403 12.652a3 3 0 010-5.304 3 3 0 00-3.75-3.751 3 3 0 00-5.305 0 3 3 0 00-3.751 3.75 3 3 0 000 5.305 3 3 0 003.75 3.751 3 3 0 005.305 0 3 3 0 003.751-3.75zm-2.546-4.46a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                          </svg>
                          <span x-text="$t('badge.accredited')"></span>
                        </span>
                      </template>
                    </div>

                    <!-- Abstract preview -->
                    <p class="text-sm text-ink-muted leading-relaxed mb-4" x-text="truncateText(paper.abstract)"></p>

                    <!-- Keywords -->
                    <template x-if="paper.keywords && paper.keywords.length > 0">
                      <div class="flex flex-wrap gap-1.5 mb-4">
                        <template x-for="kw in paper.keywords" :key="kw">
                          <span class="text-xs px-2 py-0.5 rounded-full bg-parchment-warm text-ink-muted" x-text="kw"></span>
                        </template>
                      </div>
                    </template>

                    <!-- Metrics -->
                    <div class="flex items-center gap-5 text-xs text-ink-muted pt-3 border-t border-parchment-dark">
                      <span class="flex items-center gap-1" title="Reviews">
                        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zm-5 0H8v2h2V9z" clip-rule="evenodd" /></svg>
                        <span x-text="(paper.review_count ?? 0) + ' '"></span>
                      </span>
                      <span class="flex items-center gap-1" title="Citations">
                        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V14a1 1 0 11-2 0V4.804z" /></svg>
                        <span x-text="paper.citation_count ?? 0"></span>
                      </span>
                      <template x-if="paper.ipfs_cid">
                        <span class="flex items-center gap-1 ml-auto rtl:ml-0 rtl:mr-auto" title="PDF">
                          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" /></svg>
                          <span x-text="$t('paperCard.pdf')"></span>
                        </span>
                      </template>
                    </div>
                  </article>
                </template>
              </div>

              <!-- Pagination -->
              <template x-if="totalPages > 1">
                <nav class="flex items-center justify-center gap-1 mt-8" aria-label="Pagination">
                  <button class="btn-secondary px-3 py-1.5 text-sm" :disabled="currentPage === 1" @click="goToPage(currentPage - 1)" x-text="$t('pagination.previous')"></button>
                  <template x-for="(page, i) in paginationPages" :key="'p' + i">
                    <template x-if="page === '...'">
                      <span class="px-2 py-1 text-sm text-ink-muted">...</span>
                    </template>
                  </template>
                  <template x-for="(page, i) in paginationPages" :key="'n' + i">
                    <template x-if="page !== '...'">
                      <button class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors"
                              :class="page === currentPage ? 'bg-pevo-teal text-white' : 'text-ink-light hover:bg-parchment-warm'"
                              :aria-current="page === currentPage ? 'page' : false"
                              @click="goToPage(page)" x-text="page"></button>
                    </template>
                  </template>
                  <button class="btn-secondary px-3 py-1.5 text-sm" :disabled="currentPage === totalPages" @click="goToPage(currentPage + 1)" x-text="$t('pagination.next')"></button>
                </nav>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- PAPER DETAIL -->
    <template x-if="$store.router.route === 'paper-detail'">
      <div x-data="paperDetailPage" class="container-narrow py-8">
        <!-- Loading -->
        <template x-if="loading">
          <div class="card animate-pulse">
            <div class="h-4 bg-parchment-warm rounded w-24 mb-4"></div>
            <div class="h-8 bg-parchment-warm rounded w-3/4 mb-3"></div>
            <div class="h-4 bg-parchment-warm rounded w-1/2 mb-6"></div>
            <div class="space-y-2">
              <div class="h-4 bg-parchment-warm rounded w-full"></div>
              <div class="h-4 bg-parchment-warm rounded w-5/6"></div>
              <div class="h-4 bg-parchment-warm rounded w-4/6"></div>
            </div>
          </div>
        </template>

        <!-- Error -->
        <template x-if="!loading && error">
          <div class="card text-center py-12">
            <h1 class="text-2xl font-bold text-ink mb-2" x-text="error"></h1>
            <p class="text-ink-muted mb-4" x-text="$t('paperDetail.notFoundDescription', { author: author, permlink: permlink })"></p>
            <div class="flex justify-center gap-3">
              <button @click="loadPaper()" class="btn-secondary" x-text="$t('paperDetail.retry')"></button>
              <a href="/" @click.prevent="navigate('/')" class="btn-primary no-underline" x-text="$t('paperDetail.backToPapers')"></a>
            </div>
          </div>
        </template>

        <!-- Paper loaded -->
        <template x-if="!loading && !error && paper">
          <div>
            <!-- Back link -->
            <a href="/" @click.prevent="navigate('/')" class="text-sm text-pevo-teal hover:text-pevo-teal-dark no-underline">
              &larr; <span x-text="$t('paperDetail.backToPapers')"></span>
            </a>

            <!-- Retraction banner -->
            <template x-if="paper.is_retracted">
              <div class="mt-4 rounded-lg border-2 border-pevo-crimson bg-pevo-crimson-light px-5 py-4">
                <div class="flex items-center gap-2 mb-1">
                  <svg class="h-5 w-5 text-pevo-crimson shrink-0" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.168 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
                  </svg>
                  <span class="text-pevo-crimson-dark font-bold text-lg uppercase tracking-wide" x-text="$t('retraction.banner')"></span>
                </div>
                <template x-if="paper.retraction_reason">
                  <p class="text-sm text-pevo-crimson-dark mt-1"><span x-text="$t('retraction.reason')"></span>: <span x-text="paper.retraction_reason"></span></p>
                </template>
                <template x-if="paper.retraction_timestamp">
                  <p class="text-xs text-pevo-crimson-dark/70 mt-1"><span x-text="$t('retraction.date')"></span>: <span x-text="formatDate(paper.retraction_timestamp)"></span></p>
                </template>
              </div>
            </template>

            <!-- Version selector -->
            <template x-if="paper.versions && paper.versions.length > 1">
              <div class="mt-4 space-y-2">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-xs font-medium text-ink-muted"><span x-text="$t('versions.label')"></span>:</span>
                  <template x-for="v in sortedVersions" :key="v.version_number">
                    <span class="inline-flex items-center gap-1.5 text-xs px-3 py-1 rounded-full border"
                          :class="v.version_number === currentVersion
                            ? 'bg-pevo-teal text-white border-pevo-teal'
                            : 'bg-parchment-warm text-ink-muted border-parchment-dark'"
                          :title="$t('versions.versionWithDate', { number: String(v.version_number), date: formatShortDate(v.created) })">
                      <span x-text="'v' + v.version_number"></span>
                      <span class="hidden sm:inline text-[0.65rem] opacity-75" x-text="formatShortDate(v.created)"></span>
                      <template x-if="!v.is_content_revision">
                        <span class="text-[0.6rem] italic" :class="v.version_number === currentVersion ? 'text-white/70' : 'text-ink-muted'"
                              :title="$t('versions.metadataOnly')" x-text="$t('versions.metadataOnlyShort')"></span>
                      </template>
                      <template x-if="v.version_number === latestVersion">
                        <span class="text-[0.6rem] font-semibold uppercase tracking-wide"
                              :class="v.version_number === currentVersion ? 'text-white/80' : 'text-pevo-teal'"
                              x-text="$t('versions.latest')"></span>
                      </template>
                    </span>
                  </template>
                </div>
              </div>
            </template>

            <!-- Bridge source info -->
            <template x-if="isBridgePaper && bridgeSource">
              <div class="mt-4 rounded-lg border border-pevo-teal/30 bg-pevo-teal-light/50 px-5 py-3 flex flex-wrap items-center justify-between gap-3">
                <div class="text-sm text-ink">
                  <span class="inline-flex items-center gap-1.5">
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wide bg-pevo-teal-light text-pevo-teal-dark border border-pevo-teal/20"
                          x-text="bridgeSource.type === 'arxiv' ? 'arXiv' : 'DOI'"></span>
                    <span x-text="$t('bridge.sourcePanel', { source: bridgeSource.source_name || bridgeSource.type || '' })"></span>
                  </span>
                  <template x-if="bridgeSource.url">
                    <span class="ml-2">
                      <a :href="bridgeSource.url" target="_blank" rel="noopener noreferrer" class="text-pevo-teal hover:underline text-sm"
                         x-text="$t('bridge.viewSource', { source: bridgeSource.source_name || bridgeSource.type || '' })"></a>
                    </span>
                  </template>
                </div>
                <template x-if="$store.auth.isConnected && $store.auth.username === paper.author">
                  <button class="btn-secondary text-sm" @click="handleBridgeSync()" :disabled="syncLoading"
                          x-text="syncLoading ? $t('bridge.syncing') : $t('bridge.syncButton')"></button>
                </template>
              </div>
            </template>

            <!-- Paper header card -->
            <article class="card mt-4">
              <div class="flex items-center gap-2 text-xs text-ink-muted mb-3">
                <span class="badge-discipline capitalize" x-text="paper.discipline"></span>
                <time :datetime="paper.created" x-text="formatDate(paper.created)"></time>
                <template x-if="paper.last_update && paper.last_update !== paper.created">
                  <span class="text-ink-muted" x-text="'(' + $t('paperDetail.updated', { date: formatDate(paper.last_update) }) + ')'"></span>
                </template>
              </div>

              <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-4">
                <h1 class="text-paper-title text-ink flex-1" x-text="paper.title"></h1>
                <div class="flex items-center gap-2 shrink-0">
                  <!-- Citation export -->
                  <div class="relative" @click.outside="citeOpen = false">
                    <button type="button" class="btn-secondary text-sm flex items-center gap-1.5" @click="citeOpen = !citeOpen" :disabled="citeLoading">
                      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V14a1 1 0 11-2 0V4.804z" /></svg>
                      <span x-text="$t('citation.citeButton')"></span>
                    </button>
                    <div x-show="citeOpen" x-transition class="absolute right-0 rtl:right-auto rtl:left-0 mt-1 w-44 rounded-lg border border-parchment-dark bg-parchment shadow-md z-10">
                      <button type="button" class="block w-full text-left px-4 py-2 text-sm text-ink hover:bg-parchment-warm transition-colors rounded-t-lg" @click="handleCitationExport('apa')" x-text="$t('citation.apaFormat')"></button>
                      <button type="button" class="block w-full text-left px-4 py-2 text-sm text-ink hover:bg-parchment-warm transition-colors" @click="handleCitationExport('bibtex')" x-text="$t('citation.bibtexFormat')"></button>
                      <button type="button" class="block w-full text-left px-4 py-2 text-sm text-ink hover:bg-parchment-warm transition-colors rounded-b-lg" @click="handleCitationExport('ris')" x-text="$t('citation.risFormat')"></button>
                    </div>
                  </div>
                  <!-- Retract button (author only) -->
                  <template x-if="$store.auth.isConnected && $store.auth.username === paper.author && !paper.is_retracted">
                    <button type="button" class="btn-secondary text-sm text-pevo-crimson border-pevo-crimson/30 hover:bg-pevo-crimson-light"
                            @click="retractDialogOpen = true" x-text="$t('retraction.retractButton')"></button>
                  </template>
                </div>
              </div>

              <!-- Retraction dialog -->
              <template x-if="retractDialogOpen">
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" @click.self="retractDialogOpen = false">
                  <div class="card max-w-md w-full mx-4">
                    <h3 class="text-lg font-bold text-pevo-crimson mb-2" x-text="$t('retraction.confirmTitle')"></h3>
                    <p class="text-sm text-ink-muted mb-4" x-text="$t('retraction.confirmDescription')"></p>
                    <div class="mb-4">
                      <label for="retract-reason" class="block text-sm font-medium text-ink mb-1" x-text="$t('retraction.reasonLabel')"></label>
                      <textarea id="retract-reason" class="select-control w-full" rows="3" :placeholder="$t('retraction.reasonPlaceholder')" x-model="retractReason" required></textarea>
                    </div>
                    <div class="flex justify-end gap-3">
                      <button type="button" class="btn-secondary text-sm" @click="retractDialogOpen = false; retractReason = ''" :disabled="retractLoading" x-text="$t('retraction.cancel')"></button>
                      <button type="button" class="btn-primary text-sm bg-pevo-crimson hover:bg-pevo-crimson-dark" @click="handleRetract()" :disabled="retractLoading || !retractReason.trim()"
                              x-text="retractLoading ? $t('retraction.retracting') : $t('retraction.confirmRetract')"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Authors -->
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-4">
                <template x-for="a in paper.authors" :key="a.hive">
                  <a :href="'/profile/' + a.hive" @click.prevent="navigate('/profile/' + a.hive)" class="text-sm no-underline hover:underline">
                    <span class="text-ink font-medium" x-text="a.name"></span>
                    <template x-if="a.affiliation">
                      <span class="text-ink-muted ml-1" x-text="'(' + a.affiliation + ')'"></span>
                    </template>
                  </a>
                </template>
                <template x-if="paper.is_accredited">
                  <span class="badge-accredited" :title="$t('badge.accreditedTitle')">
                    <svg class="mr-1 h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                      <path fill-rule="evenodd" d="M16.403 12.652a3 3 0 010-5.304 3 3 0 00-3.75-3.751 3 3 0 00-5.305 0 3 3 0 00-3.751 3.75 3 3 0 000 5.305 3 3 0 003.75 3.751 3 3 0 005.305 0 3 3 0 003.751-3.75zm-2.546-4.46a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                    </svg>
                    <span x-text="$t('badge.accredited')"></span>
                  </span>
                </template>
              </div>

              <!-- Keywords -->
              <template x-if="paper.keywords && paper.keywords.length > 0">
                <div class="flex flex-wrap gap-1.5 mb-6">
                  <template x-for="kw in paper.keywords" :key="kw">
                    <span class="text-xs px-2 py-0.5 rounded-full bg-parchment-warm text-ink-muted" x-text="kw"></span>
                  </template>
                </div>
              </template>

              <!-- Metrics bar -->
              <div class="flex flex-wrap items-center gap-5 text-sm text-ink-muted pb-6 border-b border-parchment-dark">
                <span class="flex items-center gap-1" title="Reviews">
                  <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zm-5 0H8v2h2V9z" clip-rule="evenodd" /></svg>
                  <span x-text="$t('paperDetail.reviews', { count: paper.reviews ? paper.reviews.length : 0 })"></span>
                </span>
                <span class="flex items-center gap-1" title="Citations">
                  <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V14a1 1 0 11-2 0V4.804z" /></svg>
                  <span x-text="$t('paperDetail.citations', { count: paper.citation_count ?? 0 })"></span>
                </span>
                <template x-if="paper.pending_payout_value">
                  <span class="text-ink-muted" x-text="$t('paperDetail.payout', { value: paper.pending_payout_value })"></span>
                </template>
                <template x-if="ipfsUrl">
                  <a :href="ipfsUrl" target="_blank" rel="noopener noreferrer"
                     class="flex items-center gap-1 ml-auto rtl:ml-0 rtl:mr-auto text-pevo-teal no-underline hover:text-pevo-teal-dark">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" /></svg>
                    <span x-text="$t('paperDetail.downloadPdf')"></span>
                  </a>
                </template>
              </div>

              <!-- DOI -->
              <template x-if="doiData && doiData.status === 'registered' && doiData.doi">
                <div class="flex items-center gap-2 mt-4 text-sm">
                  <span class="font-medium text-ink" x-text="$t('doi.label') + ':'"></span>
                  <a :href="doiData.doi_url || ('https://doi.org/' + doiData.doi)" target="_blank" rel="noopener noreferrer"
                     class="text-pevo-teal hover:text-pevo-teal-dark no-underline" x-text="doiData.doi"></a>
                  <button type="button" class="text-ink-muted hover:text-ink transition-colors" :title="$t('doi.copyDoi')" @click="copyDoi()">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M8 2a1 1 0 000 2h2a1 1 0 100-2H8z" /><path d="M3 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v6h-4.586l1.293-1.293a1 1 0 00-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L10.414 13H15v3a2 2 0 01-2 2H5a2 2 0 01-2-2V5zM15 11h2a1 1 0 110 2h-2v-2z" /></svg>
                  </button>
                </div>
              </template>

              <!-- Assign DOI button -->
              <template x-if="$store.auth.isConnected && $store.auth.username === paper.author && !paper.is_retracted && doiData && doiData.status === 'unregistered'">
                <div class="mt-4">
                  <button type="button" class="btn-secondary text-sm flex items-center gap-1.5" @click="handleAssignDoi()" :disabled="doiLoading"
                          x-text="doiLoading ? $t('doi.assigning') : $t('doi.assignButton')"></button>
                </div>
              </template>

              <!-- Abstract (always visible) -->
              <div class="mt-6 prose prose-ink max-w-reading text-ink-light text-[0.95rem] leading-relaxed" x-markdown="paper.abstract"></div>

              <!-- Full paper body (collapsible, only if there is text beyond abstract) -->
              <template x-if="hasFullText">
                <div class="mt-6">
                  <button type="button" class="btn-secondary text-sm mb-3" @click="bodyExpanded = !bodyExpanded"
                          x-text="bodyExpanded ? $t('paperDetail.collapseBody') : $t('paperDetail.showFullPaper')"></button>
                  <div x-show="bodyExpanded" class="prose prose-ink max-w-reading text-ink-light text-[0.95rem] leading-relaxed" x-markdown="bodyWithoutAbstract"></div>
                </div>
              </template>
            </article>

            <!-- Citations / References -->
            <template x-if="paper.citations && paper.citations.length > 0">
              <section class="mt-8">
                <h2 class="text-section-title text-ink font-serif mb-4" x-text="$t('paperDetail.referencesTitle')"></h2>
                <div class="space-y-2">
                  <template x-for="c in paper.citations" :key="c.author + '/' + c.permlink">
                    <a :href="'/paper/' + c.author + '/' + c.permlink" @click.prevent="navigate('/paper/' + c.author + '/' + c.permlink)"
                       class="card block no-underline hover:shadow-sm transition-shadow">
                      <p class="text-sm font-medium text-ink" x-text="c.title"></p>
                      <p class="text-xs text-ink-muted mt-1" x-text="'@' + c.author"></p>
                    </a>
                  </template>
                </div>
              </section>
            </template>

            <!-- Supplementary Files -->
            <template x-if="supplementaryFiles.length > 0">
              <section class="mt-8">
                <h2 class="text-section-title text-ink font-serif mb-4" x-text="$t('paperDetail.supplementaryFiles')"></h2>
                <div class="space-y-2">
                  <template x-for="sf in supplementaryFiles" :key="sf.cid">
                    <a :href="supplementaryFileUrl(sf.cid)" target="_blank" rel="noopener noreferrer"
                       class="card flex items-center gap-3 no-underline hover:shadow-sm transition-shadow">
                      <svg class="h-5 w-5 shrink-0 text-pevo-teal" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" /></svg>
                      <div class="min-w-0 flex-1">
                        <p class="text-sm font-medium text-ink truncate" x-text="sf.filename"></p>
                        <p class="text-xs text-ink-muted" x-text="(sf.description ? sf.description + ' · ' : '') + formatFileSize(sf.size)"></p>
                      </div>
                    </a>
                  </template>
                </div>
              </section>
            </template>

            <!-- Reviews section -->
            <section class="mt-8">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <h2 class="text-section-title text-ink font-serif" x-text="$t('paperDetail.peerReviewsTitle', { count: paper.reviews ? paper.reviews.length : 0 })"></h2>
                <a x-show="!isOwnPaper"
                   :href="'/review/' + paper.author + '/' + paper.permlink"
                   @click.prevent="navigate('/review/' + paper.author + '/' + paper.permlink)"
                   class="btn-primary text-sm w-full sm:w-auto text-center shrink-0 no-underline" x-text="$t('paperDetail.writeReview')"></a>
              </div>

              <!-- Average ratings -->
              <template x-if="averageRatings">
                <div class="card mb-6">
                  <h3 class="text-sm font-semibold text-ink mb-3" x-text="$t('paperDetail.averageRatings', { count: paper.reviews.length })"></h3>
                  <div class="space-y-2">
                    <template x-for="[key, label] in [['methodology', $t('review.methodology')], ['novelty', $t('review.novelty')], ['clarity', $t('review.clarity')], ['significance', $t('review.significance')]]" :key="key">
                      <div class="flex items-center gap-3 text-sm">
                        <span class="w-28 text-ink-muted shrink-0" x-text="label"></span>
                        <div class="flex-1 h-2 bg-parchment-warm rounded-full overflow-hidden">
                          <div class="h-full bg-pevo-teal rounded-full transition-all" :style="`width: ${(averageRatings[key] / 5) * 100}%`"></div>
                        </div>
                        <span class="w-8 text-right font-medium text-ink" x-text="averageRatings[key] + '/5'"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Individual reviews -->
              <template x-if="paper.reviews && paper.reviews.length > 0">
                <div class="space-y-4">
                  <template x-for="rev in paper.reviews" :key="rev.permlink">
                    <div class="card">
                      <!-- Review header -->
                      <div class="flex items-start justify-between mb-4">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="font-medium text-ink" x-text="rev.is_anonymous ? $t('review.anonymousReviewer') : ('@' + rev.author)"></span>
                            <template x-if="rev.is_accredited">
                              <span class="badge-accredited" :title="$t('badge.accreditedTitle')">
                                <svg class="mr-1 h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                  <path fill-rule="evenodd" d="M16.403 12.652a3 3 0 010-5.304 3 3 0 00-3.75-3.751 3 3 0 00-5.305 0 3 3 0 00-3.751 3.75 3 3 0 000 5.305 3 3 0 003.75 3.751 3 3 0 005.305 0 3 3 0 003.751-3.75zm-2.546-4.46a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                                </svg>
                                <span x-text="$t('badge.accredited')"></span>
                              </span>
                            </template>
                            <template x-if="rev.is_anonymous">
                              <span class="text-xs px-2 py-0.5 rounded bg-parchment-warm text-ink-muted" x-text="$t('review.anonymous')"></span>
                            </template>
                          </div>
                          <div class="flex items-center gap-2">
                            <time class="text-xs text-ink-muted" :datetime="rev.created" x-text="formatDate(rev.created)"></time>
                            <template x-if="rev.reviewed_version">
                              <span class="text-xs text-ink-muted" x-text="'· ' + $t('review.reviewedVersion', { version: String(rev.reviewed_version) })"></span>
                            </template>
                          </div>
                        </div>
                        <span class="flex items-center gap-1 text-xs text-ink-muted">
                          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3l-7 7h4v7h6v-7h4L10 3z" /></svg>
                          <span x-text="rev.net_votes ?? 0"></span>
                        </span>
                      </div>

                      <!-- Ratings -->
                      <div class="space-y-2 mb-4 p-4 bg-parchment rounded-lg">
                        <template x-for="[rKey, rLabel] in [['methodology', $t('review.methodology')], ['novelty', $t('review.novelty')], ['clarity', $t('review.clarity')], ['significance', $t('review.significance')]]" :key="rKey">
                          <div class="flex items-center gap-3 text-sm">
                            <span class="w-28 text-ink-muted shrink-0" x-text="rLabel"></span>
                            <div class="flex-1 h-2 bg-parchment-warm rounded-full overflow-hidden">
                              <div class="h-full bg-pevo-teal rounded-full transition-all" :style="`width: ${(rev.rating[rKey] / 5) * 100}%`"></div>
                            </div>
                            <span class="w-8 text-right font-medium text-ink" x-text="rev.rating[rKey] + '/5'"></span>
                          </div>
                        </template>
                      </div>

                      <!-- Review body -->
                      <div class="text-sm text-ink-light leading-relaxed prose prose-sm max-w-none" x-markdown="rev.body"></div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- No reviews -->
              <template x-if="!paper.reviews || paper.reviews.length === 0">
                <div class="card text-center py-8">
                  <template x-if="!isOwnPaper">
                    <div>
                      <p class="text-ink-muted mb-3" x-text="$t('paperDetail.noReviews')"></p>
                      <a :href="'/review/' + paper.author + '/' + paper.permlink"
                         @click.prevent="navigate('/review/' + paper.author + '/' + paper.permlink)"
                         class="btn-primary text-sm no-underline" x-text="$t('paperDetail.writeReview')"></a>
                    </div>
                  </template>
                  <template x-if="isOwnPaper">
                    <p class="text-ink-muted" x-text="$t('paperDetail.noReviewsYet')"></p>
                  </template>
                </div>
              </template>
            </section>

            <!-- Discussion section -->
            <section class="mt-8" x-data="threadedComments({ paperAuthor: paper.author, paperPermlink: paper.permlink })"
                     x-on:comment-posted.window="loadComments()">
              <h2 class="text-section-title text-ink font-serif mb-4" x-text="$t('comments.titleWithCount', { count: totalCount })"></h2>

              <!-- Loading -->
              <p x-show="loading" class="text-sm text-ink-muted" x-text="$t('comments.loading')"></p>

              <!-- Error -->
              <p x-show="error" class="text-sm text-pevo-crimson" x-text="error"></p>

              <!-- Top-level comment composer -->
              <template x-if="$store.auth.isConnected">
                <div class="mb-4" x-data="commentComposer({ parentAuthor: paper.author, parentPermlink: paper.permlink })">
                  <textarea class="w-full rounded-md border border-parchment-dark bg-white px-3 py-2 text-sm text-ink placeholder:text-ink-muted focus:border-pevo-teal focus:outline-none focus:ring-1 focus:ring-pevo-teal resize-y"
                            rows="3" :placeholder="$t('comments.startDiscussion')"
                            x-model="body" :disabled="isSubmitting"></textarea>
                  <p x-show="error" class="text-xs text-pevo-crimson mt-1" x-text="error"></p>
                  <div class="flex justify-end mt-2">
                    <button class="btn-primary text-sm" @click="handleSubmit()" :disabled="isSubmitting || !body.trim()"
                            x-text="isSubmitting ? $t('comments.posting') : $t('comments.postComment')"></button>
                  </div>
                </div>
              </template>

              <!-- Connect prompt -->
              <template x-if="!$store.auth.isConnected">
                <p class="text-sm text-ink-muted mb-4" x-text="$t('comments.connectToComment')"></p>
              </template>

              <!-- No comments -->
              <template x-if="!loading && !error && totalCount === 0">
                <p class="text-sm text-ink-muted" x-text="$t('comments.noComments')"></p>
              </template>

              <!-- Threaded comments -->
              <div x-show="!loading && totalCount > 0" class="space-y-4" x-html="commentsHtml"></div>
            </section>
          </div>
        </template>
      </div>
    </template>

    <!-- PUBLISH -->
    <template x-if="$store.router.route === 'publish'">
      <div x-data="publishPage" class="container-narrow py-8">
        <h1 class="text-3xl font-bold text-ink mb-2" x-text="$t('publish.title')"></h1>
        <p class="text-ink-muted mb-8" x-text="$t('publish.description')"></p>

        <!-- Draft restored banner -->
        <template x-if="draftRestored && draftSavedAt">
          <div class="card bg-pevo-teal-light border-pevo-teal/30 mb-6">
            <div class="flex items-center justify-between">
              <p class="text-sm text-ink">Draft restored from <span x-text="draftTimeAgo()"></span>.</p>
              <button type="button" class="text-sm font-medium text-pevo-teal hover:text-pevo-teal-dark" @click="discardDraft()">Discard</button>
            </div>
          </div>
        </template>

        <!-- Not connected warning -->
        <template x-if="!isConnected">
          <div class="card bg-pevo-crimson-light border-pevo-crimson/30 mb-6">
            <div class="flex items-start gap-3">
              <svg class="h-5 w-5 text-pevo-crimson shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.168 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" /></svg>
              <div>
                <p class="font-medium text-ink text-sm" x-text="$t('publish.walletNotConnected')"></p>
                <p class="text-xs text-ink-muted mt-1" x-text="$t('publish.walletHint')"></p>
                <button class="btn-primary text-xs mt-2" @click="handleConnect()" x-text="$t('common.connectWallet')"></button>
              </div>
            </div>
          </div>
        </template>

        <!-- Not accredited warning -->
        <template x-if="isConnected && !isAccredited">
          <div class="card bg-pevo-crimson-light border-pevo-crimson/30 mb-6">
            <div class="flex items-start gap-3">
              <svg class="h-5 w-5 text-pevo-crimson shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.168 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" /></svg>
              <div>
                <p class="font-medium text-ink text-sm" x-text="$t('publish.accreditationRequired')"></p>
                <a href="/accreditation" @click.prevent="navigate('/accreditation')" class="btn-primary text-xs mt-2 no-underline inline-block" x-text="$t('publish.getAccredited')"></a>
              </div>
            </div>
          </div>
        </template>

        <!-- Progress indicator -->
        <template x-if="step !== 'idle'">
          <div class="card mb-6" :class="stepClass">
            <p class="text-sm font-medium" x-text="stepMessage"></p>
            <template x-if="step === 'error'">
              <button class="btn-secondary text-xs mt-2" @click="step = 'idle'" x-text="$t('publish.tryAgain')"></button>
            </template>
          </div>
        </template>

        <form @submit.prevent="isAccredited ? handleSubmit() : null" class="space-y-6">
          <!-- Title -->
          <div class="card">
            <label for="paper-title" class="block text-sm font-semibold text-ink mb-2" x-text="$t('publish.paperTitle')"></label>
            <input id="paper-title" type="text" class="select-control text-base" :placeholder="$t('publish.titlePlaceholder')" x-model="title" required />
          </div>

          <!-- Abstract -->
          <div class="card">
            <label class="block text-sm font-semibold text-ink mb-2" x-text="$t('publish.abstract')"></label>
            <div x-ref="abstractEditor"></div>
            <p class="text-xs text-ink-muted mt-1" x-text="$t('publish.abstractHint')"></p>
          </div>

          <!-- Discipline + Keywords -->
          <div class="card">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="relative" @click.outside="disciplineDropdownOpen = false">
                <label for="discipline" class="block text-sm font-semibold text-ink mb-2" x-text="$t('filters.discipline')"></label>
                <input id="discipline" type="text" class="select-control" :placeholder="$t('publish.disciplinePlaceholder')"
                       :value="disciplineDisplayValue" @input="onDisciplineInput($event)" @focus="disciplineDropdownOpen = true" autocomplete="off" required />
                <template x-if="discipline && !disciplineDropdownOpen">
                  <button type="button" class="absolute right-2 top-9 text-ink-muted hover:text-ink" @click="clearDiscipline()">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                  </button>
                </template>
                <div x-show="disciplineDropdownOpen" class="absolute z-20 mt-1 w-full max-h-60 overflow-auto rounded-lg border border-parchment-dark bg-parchment shadow-md">
                  <template x-if="filteredTaxonomy.length === 0">
                    <div class="px-4 py-2 text-sm text-ink-muted" x-text="$t('publish.noDisciplineMatch')"></div>
                  </template>
                  <template x-for="group in filteredTaxonomy" :key="group.field">
                    <div>
                      <div class="px-4 py-1.5 text-xs font-semibold text-ink-muted uppercase tracking-wide bg-parchment-warm" x-text="group.field"></div>
                      <template x-for="sf in group.subfields" :key="sf">
                        <button type="button" class="block w-full text-left px-4 py-2 text-sm text-ink hover:bg-parchment-warm transition-colors" x-text="sf" @click="selectDiscipline(sf)"></button>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
              <div>
                <label for="keywords" class="block text-sm font-semibold text-ink mb-2" x-text="$t('publish.keywords')"></label>
                <input id="keywords" type="text" class="select-control" :placeholder="$t('publish.keywordsPlaceholder')" x-model="keywordsText" />
                <p class="text-xs text-ink-muted mt-1" x-text="$t('publish.keywordsHint')"></p>
              </div>
            </div>
          </div>

          <!-- Primary author -->
          <div class="card">
            <label class="block text-sm font-semibold text-ink mb-3" x-text="$t('publish.yourInfo')"></label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label for="author-name" class="block text-xs font-medium text-ink-muted mb-1"><span x-text="$t('publish.yourName')"></span> *</label>
                <input id="author-name" type="text" class="select-control" :placeholder="$t('publish.fullName')" x-model="authorName" required />
              </div>
              <div>
                <label for="author-affiliation" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('publish.affiliation')"></label>
                <input id="author-affiliation" type="text" class="select-control" :placeholder="$t('publish.affiliation')" x-model="authorAffiliation" />
              </div>
              <div>
                <label for="author-orcid" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('publish.orcidOptional')"></label>
                <input id="author-orcid" type="text" class="select-control" placeholder="0000-0001-2345-6789" x-model="authorOrcid" />
              </div>
            </div>
          </div>

          <!-- Co-authors -->
          <div class="card">
            <div class="flex items-center justify-between mb-3">
              <label class="text-sm font-semibold text-ink" x-text="$t('publish.coAuthors')"></label>
              <button type="button" class="btn-secondary text-xs" @click="addCoAuthor()" x-text="$t('publish.addCoAuthor')"></button>
            </div>
            <template x-if="coAuthors.length === 0">
              <p class="text-xs text-ink-muted" x-text="$t('publish.noCoAuthors')"></p>
            </template>
            <template x-for="(ca, i) in coAuthors" :key="i">
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 mt-3 p-3 bg-parchment rounded-lg">
                <input type="text" class="select-control text-xs" :placeholder="$t('publish.fullName')" :value="ca.name" @input="updateCoAuthor(i, 'name', $event.target.value)" />
                <input type="text" class="select-control text-xs" :placeholder="$t('publish.hiveUsername')" :value="ca.hive" @input="updateCoAuthor(i, 'hive', $event.target.value)" />
                <input type="text" class="select-control text-xs" :placeholder="$t('publish.orcidOptional')" :value="ca.orcid" @input="updateCoAuthor(i, 'orcid', $event.target.value)" />
                <div class="flex gap-2">
                  <input type="text" class="select-control text-xs flex-1" :placeholder="$t('publish.affiliation')" :value="ca.affiliation" @input="updateCoAuthor(i, 'affiliation', $event.target.value)" />
                  <button type="button" class="text-ink-muted hover:text-ink shrink-0 px-1" @click="removeCoAuthor(i)">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                  </button>
                </div>
              </div>
            </template>
          </div>

          <!-- Paper body (full editor) -->
          <div class="card">
            <label class="text-sm font-semibold text-ink mb-2 block" x-text="$t('publish.paperContent')"></label>
            <div x-ref="bodyEditor"></div>
            <p class="text-xs text-ink-muted mt-2" x-text="$t('publish.markdownHint')"></p>
          </div>

          <!-- PDF Upload -->
          <div class="card">
            <label for="pdf-upload" class="text-sm font-semibold text-ink mb-2 block" x-text="$t('publish.pdfUpload')"></label>
            <p class="text-xs text-ink-muted mb-3" x-text="$t('publish.pdfHint')"></p>
