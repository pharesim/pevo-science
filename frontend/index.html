            <input id="pdf-upload" type="file" accept=".pdf" class="block text-sm text-ink-muted file:mr-4 file:py-2 file:px-4 file:rounded-md file:border file:border-parchment-dark file:text-sm file:font-medium file:bg-white file:text-ink hover:file:bg-parchment-warm file:cursor-pointer file:transition-colors" @change="handlePdfChange($event)" />
            <template x-if="pdfFile">
              <p class="text-xs text-pevo-green mt-2">Selected: <span x-text="pdfFileName"></span> (<span x-text="pdfFileSize"></span> MB)</p>
            </template>
          </div>

          <!-- Supplementary Files -->
          <div class="card">
            <label class="text-sm font-semibold text-ink mb-2 block" x-text="$t('publish.supplementaryFiles')"></label>
            <p class="text-xs text-ink-muted mb-3" x-text="$t('publish.supplementaryFilesHint')"></p>

            <!-- File list -->
            <template x-if="supplementaryFiles.length > 0">
              <div class="space-y-2 mb-3">
                <template x-for="(sf, i) in supplementaryFiles" :key="i">
                  <div class="flex flex-col gap-2 p-3 bg-parchment rounded-md border border-parchment-dark">
                    <div class="flex items-center justify-between gap-2">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="text-sm font-medium text-ink truncate" x-text="sf.fileName"></span>
                        <span class="text-xs text-ink-muted shrink-0" x-text="sf.fileSize + ' MB'"></span>
                        <template x-if="sf.cid">
                          <span class="text-xs text-pevo-green shrink-0">&#10003;</span>
                        </template>
                        <template x-if="sf.uploading">
                          <span class="text-xs text-pevo-teal shrink-0" x-text="$t('publish.uploading')"></span>
                        </template>
                        <template x-if="sf.error">
                          <span class="text-xs text-pevo-crimson shrink-0" x-text="sf.error"></span>
                        </template>
                      </div>
                      <button type="button" class="text-xs text-pevo-crimson hover:text-pevo-crimson-dark shrink-0" @click="removeSupplementaryFile(i)" x-text="$t('publish.removeFile')"></button>
                    </div>
                    <input type="text" class="input text-sm" :placeholder="$t('publish.fileDescriptionPlaceholder')" :value="sf.description" @input="updateSupplementaryDescription(i, $event.target.value)" />
                  </div>
                </template>
              </div>
            </template>

            <!-- Add files button -->
            <template x-if="supplementaryFiles.length < 5">
              <div>
                <label class="inline-flex items-center gap-2 cursor-pointer text-sm text-pevo-teal hover:text-pevo-teal-dark">
                  <span x-text="$t('publish.addSupplementaryFile')"></span>
                  <input type="file" class="hidden" multiple accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.svg,.csv,.zip" @change="handleSupplementaryFiles($event)" />
                </label>
              </div>
            </template>
          </div>

          <!-- Transaction size warning -->
          <template x-if="txWarn">
            <div class="card" :class="txBlock ? 'bg-pevo-crimson-light border-pevo-crimson/30' : 'bg-pevo-gold-light border-pevo-gold/30'">
              <p class="text-sm font-medium" :class="txBlock ? 'text-pevo-crimson' : 'text-pevo-gold-dark'" x-text="txBlock ? $t('publish.txTooLarge') : $t('publish.txWarnLarge')"></p>
              <p class="text-xs text-ink-muted mt-1" x-text="$t('publish.txSizeHint', { current: Math.round(txEstimate / 1024), max: Math.round(60000 / 1024) })"></p>
            </div>
          </template>

          <!-- Submit -->
          <div class="flex flex-col-reverse sm:flex-row items-start sm:items-center justify-between gap-3">
            <p class="text-xs text-ink-muted" x-text="$t('publish.permanentNotice')"></p>
            <template x-if="isAccredited">
              <button type="submit" class="btn-primary w-full sm:w-auto shrink-0" :disabled="isSubmitting || txBlock"
                      x-text="isSubmitting ? $t('publish.publishing') : $t('publish.publishButton')"></button>
            </template>
            <template x-if="!isAccredited && !isConnected">
              <a href="/getting-started" @click.prevent="navigate('/getting-started')" class="btn-primary w-full sm:w-auto shrink-0 text-center no-underline" x-text="$t('publish.publishButton')"></a>
            </template>
            <template x-if="!isAccredited && isConnected">
              <a href="/accreditation" @click.prevent="navigate('/accreditation')" class="btn-primary w-full sm:w-auto shrink-0 text-center no-underline" x-text="$t('publish.getAccredited')"></a>
            </template>
          </div>
        </form>

        <p class="text-sm text-ink-muted mt-4">
          <span x-text="$t('publish.needHelp')"></span>
          <a href="/contact?category=keychain" @click.prevent="navigate('/contact?category=keychain')" class="text-pevo-teal hover:underline" x-text="$t('publish.contactUs')"></a>
        </p>
      </div>
    </template>

    <!-- REVIEW -->
    <template x-if="$store.router.route === 'review'">
      <div x-data="reviewPage" class="container-narrow py-8">
        <a :href="'/paper/' + author + '/' + permlink" @click.prevent="navigate('/paper/' + author + '/' + permlink)" class="text-sm text-pevo-teal hover:text-pevo-teal-dark no-underline">&larr; <span x-text="$t('review.backToPaper')"></span></a>

        <h1 class="text-3xl font-bold text-ink mt-4 mb-2" x-text="$t('review.title')"></h1>
        <p class="text-ink-muted mb-2" x-text="$t('review.reviewing')"></p>
        <template x-if="loadingPaper">
          <p class="text-sm text-ink-muted mb-8" x-text="$t('review.loadingPaper')"></p>
        </template>
        <template x-if="!loadingPaper">
          <a :href="'/paper/' + author + '/' + permlink" @click.prevent="navigate('/paper/' + author + '/' + permlink)" class="text-sm font-medium text-pevo-teal no-underline hover:underline mb-8 block" x-text="paperTitle"></a>
        </template>

        <!-- Not connected warning -->
        <template x-if="!isConnected">
          <div class="card bg-pevo-crimson-light border-pevo-crimson/30 mb-6">
            <div class="flex items-start gap-3">
              <svg class="h-5 w-5 text-pevo-crimson shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.168 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" /></svg>
              <div>
                <p class="font-medium text-ink text-sm" x-text="$t('review.walletNotConnected')"></p>
                <p class="text-xs text-ink-muted mt-1" x-text="$t('review.walletHint')"></p>
                <button class="btn-primary text-xs mt-2" @click="handleConnect()" x-text="$t('common.connectWallet')"></button>
              </div>
            </div>
          </div>
        </template>

        <!-- Not accredited -->
        <template x-if="isConnected && !isAccredited">
          <div class="card bg-pevo-crimson-light border-pevo-crimson/30 mb-6">
            <div class="flex items-start gap-3">
              <svg class="h-5 w-5 text-pevo-crimson shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.168 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" /></svg>
              <div>
                <p class="font-medium text-ink text-sm" x-text="$t('review.accreditationRequired')"></p>
                <a href="/accreditation" @click.prevent="navigate('/accreditation')" class="btn-primary text-xs mt-2 no-underline inline-block" x-text="$t('review.getAccredited')"></a>
              </div>
            </div>
          </div>
        </template>

        <!-- Own paper warning -->
        <template x-if="isConnected && isOwnPaper">
          <div class="card bg-pevo-crimson-light border-pevo-crimson/30 mb-6">
            <div class="flex items-start gap-3">
              <svg class="h-5 w-5 text-pevo-crimson shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.168 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" /></svg>
              <p class="font-medium text-ink text-sm" x-text="$t('review.cannotReviewOwn')"></p>
            </div>
          </div>
        </template>

        <!-- Progress indicator -->
        <template x-if="step !== 'idle'">
          <div class="card mb-6" :class="stepClass">
            <p class="text-sm font-medium" x-text="stepMessage"></p>
            <template x-if="step === 'error'">
              <button class="btn-secondary text-xs mt-2" @click="step = 'idle'" x-text="$t('review.tryAgain')"></button>
            </template>
          </div>
        </template>

        <template x-if="isAccredited && !isOwnPaper">
          <form @submit.prevent="handleSubmit()" class="space-y-6">
            <!-- Star ratings -->
            <div class="card">
              <h2 class="text-section-title text-ink font-serif mb-4" x-text="$t('review.ratingsTitle')"></h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <template x-for="key in ratingKeys" :key="key">
                  <div class="p-4 bg-parchment rounded-lg">
                    <div class="flex items-center justify-between mb-1">
                      <span class="text-sm font-medium text-ink" x-text="ratingLabel(key)"></span>
                      <span class="text-sm font-bold text-ink" x-text="ratings[key] > 0 ? ratings[key] + '/5' : '--'"></span>
                    </div>
                    <p class="text-xs text-ink-muted mb-2" x-text="ratingDesc(key)"></p>
                    <div class="flex gap-1">
                      <template x-for="star in [1,2,3,4,5]" :key="star">
                        <button type="button" @click="setRating(key, star)"
                                :class="star <= ratings[key] ? 'text-pevo-teal' : 'text-parchment-dark hover:text-ink-muted'"
                                class="p-2 rounded transition-colors">
                          <svg class="h-7 w-7 sm:h-6 sm:w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                        </button>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Review body -->
            <div class="card">
              <div class="flex items-center justify-between mb-2">
                <label for="review-body" class="text-sm font-semibold text-ink" x-text="$t('review.writtenReview')"></label>
                <button type="button" class="text-xs text-pevo-teal hover:text-pevo-teal-dark" @click="showPreview = !showPreview" x-text="showPreview ? $t('review.edit') : $t('review.preview')"></button>
              </div>
              <div x-show="showPreview" class="min-h-[200px] p-4 bg-parchment rounded-lg text-sm text-ink-light leading-relaxed whitespace-pre-line" x-text="reviewBody || $t('review.nothingToPreview')"></div>
              <textarea x-show="!showPreview" id="review-body" class="select-control font-mono text-sm min-h-[200px] resize-y" :placeholder="$t('review.reviewPlaceholder')" x-model="reviewBody" required></textarea>
            </div>

            <!-- Anonymous option -->
            <div class="card">
              <label class="flex items-start gap-3 cursor-pointer">
                <input type="checkbox" class="mt-1 h-4 w-4 rounded border-parchment-dark text-pevo-teal focus:ring-accent" x-model="isAnonymous" />
                <div>
                  <span class="text-sm font-medium text-ink" x-text="$t('review.anonymousLabel')"></span>
                  <p class="text-xs text-ink-muted mt-1" x-text="$t('review.anonymousDescription')"></p>
                </div>
              </label>
            </div>

            <!-- Submit -->
            <div class="flex flex-col-reverse sm:flex-row items-start sm:items-center justify-between gap-3">
              <p class="text-xs text-ink-muted" x-text="$t('review.permanentNotice')"></p>
              <button type="submit" class="btn-primary w-full sm:w-auto shrink-0" :disabled="!isConnected || !allRated || isSubmitting"
                      x-text="isSubmitting ? $t('review.submitting') : $t('review.submitButton')"></button>
            </div>
          </form>
        </template>
      </div>
    </template>

    <!-- SEARCH -->
    <template x-if="$store.router.route === 'search'">
      <div x-data="searchPage" class="container-narrow py-8">
        <h1 class="text-3xl font-bold text-ink mb-2" x-text="$t('search.title')"></h1>
        <p class="text-ink-muted mb-6" x-text="$t('search.description')"></p>

        <!-- Search form -->
        <form @submit.prevent="handleSubmit()" role="search" class="mb-6">
          <div class="flex flex-col sm:flex-row gap-2">
            <label for="search-query" class="sr-only" x-text="$t('search.title')"></label>
            <input id="search-query" type="search" class="select-control flex-1 text-base" :placeholder="$t('search.placeholder')" x-model="query" />
            <button type="submit" class="btn-primary w-full sm:w-auto shrink-0" :disabled="loading"
                    x-text="loading ? $t('search.searching') : $t('search.searchButton')"></button>
          </div>

          <!-- Filters row -->
          <div class="flex flex-wrap gap-3 mt-3">
            <div>
              <label for="search-type" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('search.typeLabel')"></label>
              <select id="search-type" class="select-control text-sm" x-model="typeFilter">
                <option value="all" x-text="$t('search.typeAll')"></option>
                <option value="paper" x-text="$t('search.typePapers')"></option>
                <option value="review" x-text="$t('search.typeReviews')"></option>
              </select>
            </div>
            <div>
              <label for="search-source" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('filters.source')"></label>
              <select id="search-source" class="select-control text-sm" x-model="sourceFilter">
                <option value="" x-text="$t('filters.allSources')"></option>
                <option value="native" x-text="$t('filters.nativePapers')"></option>
                <option value="bridge" x-text="$t('filters.preprints')"></option>
              </select>
            </div>
            <div>
              <label for="search-discipline" class="block text-xs font-medium text-ink-muted mb-1" x-text="$t('filters.discipline')"></label>
              <select id="search-discipline" class="select-control text-sm capitalize" x-model="disciplineFilter">
                <option value="" x-text="$t('filters.allDisciplines')"></option>
                <template x-for="d in disciplines" :key="d.name">
                  <option :value="d.name" x-text="d.name" class="capitalize"></option>
                </template>
              </select>
            </div>
          </div>
        </form>

        <!-- Loading -->
        <template x-if="loading">
          <div class="space-y-4">
            <template x-for="i in 4" :key="i">
              <div class="card animate-pulse">
                <div class="h-4 bg-parchment-warm rounded w-24 mb-2"></div>
                <div class="h-5 bg-parchment-warm rounded w-2/3 mb-2"></div>
                <div class="h-4 bg-parchment-warm rounded w-full"></div>
              </div>
            </template>
          </div>
        </template>

        <!-- Error -->
        <template x-if="!loading && error">
          <div class="card text-center py-12">
            <p class="text-ink-muted" x-text="error"></p>
          </div>
        </template>

        <!-- Results -->
        <template x-if="!loading && !error && hasSearched">
          <div>
            <div class="text-sm text-ink-muted mb-4" x-text="$t('search.resultsFound', { count: results.length })"></div>

            <template x-if="results.length > 0">
              <div>
                <div class="space-y-4">
                  <template x-for="result in results" :key="result.author + '/' + result.permlink">
                    <article class="card hover:shadow-sm transition-shadow">
                      <div class="flex items-center gap-2 text-xs text-ink-muted mb-2">
                        <span class="badge-discipline capitalize" x-text="result.type"></span>
                        <time :datetime="result.created" x-text="formatDate(result.created)"></time>
                        <template x-if="result.is_accredited">
                          <span class="badge-accredited" :title="$t('badge.accreditedTitle')">
                            <svg class="mr-1 h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                              <path fill-rule="evenodd" d="M16.403 12.652a3 3 0 010-5.304 3 3 0 00-3.75-3.751 3 3 0 00-5.305 0 3 3 0 00-3.751 3.75 3 3 0 000 5.305 3 3 0 003.75 3.751 3 3 0 005.305 0 3 3 0 003.751-3.75zm-2.546-4.46a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                            </svg>
                            <span x-text="$t('badge.accredited')"></span>
                          </span>
                        </template>
                      </div>
                      <h2 class="text-lg font-serif font-semibold mb-1">
                        <a :href="'/paper/' + result.author + '/' + result.permlink"
                           @click.prevent="navigate('/paper/' + result.author + '/' + result.permlink)"
                           class="text-ink hover:text-pevo-teal no-underline" x-text="result.title"></a>
                      </h2>
                      <p class="text-xs text-ink-muted mb-2" x-text="'@' + result.author"></p>
                      <div class="text-sm text-ink-light leading-relaxed [&_mark]:bg-yellow-200 [&_mark]:px-0.5 [&_mark]:rounded"
                           x-html="sanitizeSnippet(result.snippet)"></div>
                    </article>
                  </template>
                </div>

                <!-- Pagination -->
                <template x-if="totalPages > 1">
                  <nav class="flex items-center justify-center gap-1 mt-8" aria-label="Pagination">
                    <button class="btn-secondary px-3 py-1.5 text-sm" :disabled="currentPage === 1" @click="goToPage(currentPage - 1)" x-text="$t('pagination.previous')"></button>
                    <template x-for="(page, i) in paginationPages" :key="'sp' + i">
                      <template x-if="page === '...'">
                        <span class="px-2 py-1 text-sm text-ink-muted">...</span>
                      </template>
                    </template>
                    <template x-for="(page, i) in paginationPages" :key="'sn' + i">
                      <template x-if="page !== '...'">
                        <button class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors"
                                :class="page === currentPage ? 'bg-pevo-teal text-white' : 'text-ink-light hover:bg-parchment-warm'"
                                :aria-current="page === currentPage ? 'page' : false"
                                @click="goToPage(page)" x-text="page"></button>
                      </template>
                    </template>
                    <button class="btn-secondary px-3 py-1.5 text-sm" :disabled="currentPage === totalPages" @click="goToPage(currentPage + 1)" x-text="$t('pagination.next')"></button>
                  </nav>
                </template>
              </div>
            </template>

            <template x-if="results.length === 0">
              <div class="card text-center py-12">
                <p class="text-ink-muted" x-text="$t('search.noResults')"></p>
              </div>
            </template>
          </div>
        </template>

        <!-- Initial state -->
        <template x-if="!loading && !error && !hasSearched">
          <div class="card text-center py-12">
            <p class="text-ink-muted" x-text="$t('search.initialPrompt')"></p>
          </div>
        </template>
      </div>
    </template>

    <!-- BRIDGE -->
    <template x-if="$store.router.route === 'bridge'">
      <div x-data="bridgePage" class="container-narrow py-8">
        <h1 class="text-3xl font-bold text-ink font-serif mb-2" x-text="$t('bridge.title')"></h1>
        <p class="text-ink-muted mb-6" x-text="$t('bridge.description')"></p>

        <!-- Not connected -->
        <template x-if="!isConnected">
          <div class="card text-center py-12">
            <p class="text-ink-muted mb-4" x-text="$t('bridge.walletHint')"></p>
            <button class="btn-primary" @click="handleConnect()" x-text="$t('common.connectWallet')"></button>
          </div>
        </template>

        <template x-if="isConnected">
          <div>
            <!-- Step 1: Identifier input -->
            <div class="card mb-6">
              <label for="bridge-id" class="block text-sm font-semibold text-ink mb-2" x-text="$t('bridge.identifierLabel')"></label>
              <div class="flex gap-3">
                <input id="bridge-id" type="text" class="select-control flex-1" :placeholder="$t('bridge.identifierPlaceholder')"
                       x-model="identifier" @keydown.enter="handleLookup()" :disabled="lookingUp" />
                <button class="btn-primary text-sm whitespace-nowrap" @click="handleLookup()" :disabled="lookingUp || !identifier.trim()"
                        x-text="lookingUp ? $t('bridge.lookingUp') : $t('bridge.lookupButton')"></button>
              </div>
              <template x-if="lookupError">
                <p class="text-sm text-pevo-crimson mt-2" x-text="lookupError"></p>
              </template>
            </div>

            <!-- Step 2: Preview -->
            <template x-if="lookup">
              <div class="card mb-6">
                <h2 class="text-lg font-semibold text-ink mb-4" x-text="$t('bridge.previewTitle')"></h2>
                <h3 class="text-base font-semibold text-ink mb-2" x-text="lookup.title"></h3>
                <div class="text-sm text-ink-light mb-3">
                  <span class="font-medium text-ink-muted" x-text="$t('bridge.authors') + ':'"></span>
                  <span x-text="lookup.authors.map(a => a.name).join(', ')"></span>
                </div>
                <div class="text-sm text-ink-muted mb-3 line-clamp-4">
                  <span class="font-medium" x-text="$t('bridge.abstract') + ':'"></span>
                  <span x-text="lookup.abstract"></span>
                </div>
                <div class="flex flex-wrap gap-4 text-sm text-ink-muted mb-3">
                  <span>
                    <span class="font-medium" x-text="$t('bridge.published') + ':'"></span>
                    <span x-text="new Date(lookup.published_date).toLocaleDateString()"></span>
                  </span>
                  <span>
                    <span class="font-medium" x-text="$t('bridge.source') + ':'"></span>
                    <a :href="lookup.source_url" target="_blank" rel="noopener noreferrer" class="text-pevo-teal hover:underline" x-text="lookup.source_name"></a>
                  </span>
                  <template x-if="lookup.pdf_url">
                    <a :href="lookup.pdf_url" target="_blank" rel="noopener noreferrer" class="text-pevo-teal hover:underline" x-text="$t('bridge.pdfLink')"></a>
                  </template>
                </div>
                <!-- Duplicate warning -->
                <template x-if="isDuplicate && check">
                  <div class="rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 mt-4">
                    <p class="text-sm font-medium text-amber-800 mb-1" x-text="$t('bridge.duplicateWarning')"></p>
                    <a :href="'/paper/' + check.author + '/' + check.permlink" @click.prevent="navigate('/paper/' + check.author + '/' + check.permlink)" class="text-sm text-pevo-teal hover:underline" x-text="$t('bridge.viewExisting')"></a>
                  </div>
                </template>
              </div>
            </template>

            <!-- Step 3: Registration form -->
            <template x-if="lookup && !isDuplicate">
              <div class="card">
                <h2 class="text-lg font-semibold text-ink mb-4" x-text="$t('bridge.registerTitle')"></h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                  <!-- Discipline picker -->
                  <div class="relative" @click.outside="disciplineDropdownOpen = false">
                    <label for="bridge-discipline" class="block text-sm font-semibold text-ink mb-2" x-text="$t('bridge.disciplineLabel')"></label>
                    <input id="bridge-discipline" type="text" class="select-control" :placeholder="$t('bridge.disciplinePlaceholder')"
                           :value="disciplineDisplayValue" @input="onDisciplineInput($event)" @focus="disciplineDropdownOpen = true" autocomplete="off" required />
                    <template x-if="discipline && !disciplineDropdownOpen">
                      <button type="button" class="absolute right-2 top-9 text-ink-muted hover:text-ink" @click="clearDiscipline()">
                        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                      </button>
                    </template>
                    <div x-show="disciplineDropdownOpen" class="absolute z-20 mt-1 w-full max-h-60 overflow-auto rounded-lg border border-parchment-dark bg-parchment shadow-md">
                      <template x-if="filteredTaxonomy.length === 0">
                        <div class="px-4 py-2 text-sm text-ink-muted" x-text="$t('bridge.noDisciplineMatch')"></div>
                      </template>
                      <template x-for="group in filteredTaxonomy" :key="group.field">
                        <div>
                          <div class="px-4 py-1.5 text-xs font-semibold text-ink-muted uppercase tracking-wide bg-parchment-warm" x-text="group.field"></div>
                          <template x-for="sf in group.subfields" :key="sf">
                            <button type="button" class="block w-full text-left px-4 py-2 text-sm text-ink hover:bg-parchment-warm transition-colors" x-text="sf" @click="selectDiscipline(sf)"></button>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                  <!-- Keywords -->
                  <div>
                    <label for="bridge-keywords" class="block text-sm font-semibold text-ink mb-2" x-text="$t('bridge.keywordsLabel')"></label>
                    <input id="bridge-keywords" type="text" class="select-control" :placeholder="$t('bridge.keywordsPlaceholder')" x-model="keywordsText" />
                  </div>
                </div>
                <!-- Language -->
                <div class="mb-6">
                  <label for="bridge-language" class="block text-sm font-semibold text-ink mb-2" x-text="$t('bridge.languageLabel')"></label>
                  <input id="bridge-language" type="text" class="select-control max-w-xs" :placeholder="$t('bridge.languagePlaceholder')" x-model="language" />
                </div>
                <!-- Status / Submit -->
                <template x-if="step === 'idle'">
                  <button class="btn-primary" @click="handleRegister()" :disabled="!canRegister" x-text="$t('bridge.registerButton')"></button>
                </template>
                <template x-if="step === 'registering'">
                  <p class="text-sm text-ink-muted" x-text="$t('bridge.stepRegistering')"></p>
                </template>
                <template x-if="step === 'success'">
                  <p class="text-sm text-pevo-green font-medium" x-text="$t('bridge.stepSuccess')"></p>
                </template>
                <template x-if="step === 'error'">
                  <div>
                    <p class="text-sm text-pevo-crimson mb-2" x-text="errorMessage"></p>
                    <button class="btn-secondary text-sm" @click="step = 'idle'" x-text="$t('bridge.tryAgain')"></button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- PROFILE -->
    <template x-if="$store.router.route === 'profile'">
      <div x-data="profilePage" class="container-narrow py-8">
        <!-- Loading -->
        <template x-if="loading">
          <div class="card animate-pulse">
            <div class="h-8 bg-parchment-warm rounded w-48 mb-3"></div>
            <div class="h-4 bg-parchment-warm rounded w-32 mb-2"></div>
            <div class="h-4 bg-parchment-warm rounded w-64"></div>
          </div>
        </template>

        <!-- Error -->
        <template x-if="!loading && error">
          <div class="card text-center py-12">
            <h1 class="text-2xl font-bold text-ink mb-2" x-text="$t('profile.notFoundTitle')"></h1>
            <p class="text-ink-muted mb-4" x-text="error"></p>
            <a href="/" @click.prevent="navigate('/')" class="btn-primary no-underline" x-text="$t('common.backToPapers')"></a>
          </div>
        </template>

        <!-- Profile loaded -->
        <template x-if="!loading && !error && profile">
          <div>
            <!-- Profile header -->
            <div class="card mb-6">
              <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                <div>
                  <div class="flex items-center gap-3 mb-2">
                    <h1 class="text-2xl font-bold text-ink" x-text="profile.accreditation?.name ?? ('@' + profile.username)"></h1>
                    <template x-if="profile.is_accredited">
                      <span class="badge-accredited" :title="$t('badge.accreditedTitle')">
                        <svg class="mr-1 h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                          <path fill-rule="evenodd" d="M16.403 12.652a3 3 0 010-5.304 3 3 0 00-3.75-3.751 3 3 0 00-5.305 0 3 3 0 00-3.751 3.75 3 3 0 000 5.305 3 3 0 003.75 3.751 3 3 0 005.305 0 3 3 0 003.751-3.75zm-2.546-4.46a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                        </svg>
                        <span x-text="$t('badge.accredited')"></span>
                      </span>
                    </template>
                  </div>
                  <p class="text-sm text-ink-muted" x-text="'@' + profile.username"></p>
                  <template x-if="profile.accreditation">
                    <div class="mt-2 text-sm text-ink-light">
                      <p x-text="profile.accreditation.institution"></p>
                      <p class="capitalize" x-text="profile.accreditation.field"></p>
                    </div>
                  </template>
                </div>
                <!-- Reputation score -->
                <div class="text-center sm:text-right">
                  <div class="text-4xl font-bold text-ink font-serif" x-text="profile.reputation?.score ?? 0"></div>
                  <div class="text-xs text-ink-muted mt-1" x-text="$t('profile.reputationScore')"></div>
                </div>
              </div>
              <template x-if="profile.accreditation">
                <div class="mt-4 pt-4 border-t border-parchment-dark text-xs text-ink-muted flex items-center gap-2 flex-wrap">
                  <span x-text="$t('profile.accreditedVia', { method: profile.accreditation.method, date: formatDate(profile.accreditation.timestamp) })"></span>
                  <template x-if="profile.accreditation.field">
                    <span> -- field: <span class="capitalize" x-text="profile.accreditation.field"></span></span>
                  </template>
                </div>
              </template>
            </div>

            <!-- Stats + Reputation breakdown -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
              <!-- Quick stats -->
              <div class="card">
                <h2 class="text-section-title text-ink font-serif mb-4" x-text="$t('profile.activity')"></h2>
                <div class="grid grid-cols-3 gap-2 sm:gap-4">
                  <div class="text-center">
                    <div class="text-2xl font-bold text-ink font-serif" x-text="profile.stats?.paper_count ?? 0"></div>
                    <div class="text-xs text-ink-muted mt-1" x-text="$t('profile.papers')"></div>
                  </div>
                  <div class="text-center">
                    <div class="text-2xl font-bold text-ink font-serif" x-text="profile.stats?.review_count ?? 0"></div>
                    <div class="text-xs text-ink-muted mt-1" x-text="$t('profile.reviews')"></div>
                  </div>
                  <div class="text-center">
                    <div class="text-2xl font-bold text-ink font-serif" x-text="profile.stats?.citation_count ?? 0"></div>
                    <div class="text-xs text-ink-muted mt-1" x-text="$t('profile.citationsLabel')"></div>
                  </div>
                </div>
                <template x-if="profile.stats?.first_pevo_post">
                  <div class="mt-4 pt-3 border-t border-parchment-dark text-xs text-ink-muted" x-text="$t('profile.firstPost', { date: formatDate(profile.stats.first_pevo_post) })"></div>
                </template>
              </div>

              <!-- Reputation breakdown -->
              <div class="card">
                <h2 class="text-section-title text-ink font-serif mb-4" x-text="$t('profile.reputationBreakdown')"></h2>
                <div class="space-y-2">
                  <template x-for="[key, value] in breakdownEntries" :key="key">
                    <div class="flex items-center gap-2 sm:gap-3 text-sm">
                      <span class="w-20 sm:w-28 text-ink-muted shrink-0 capitalize text-xs sm:text-sm" x-text="key.replace(/_/g, ' ')"></span>
                      <div class="flex-1 h-2 bg-parchment-warm rounded-full overflow-hidden">
                        <div class="h-full bg-pevo-teal rounded-full" :style="`width: ${breakdownPct(value)}%`"></div>
                      </div>
                      <span class="w-8 text-right font-medium text-ink" x-text="value"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- User's papers -->
            <section>
              <h2 class="text-section-title text-ink font-serif mb-4" x-text="$t('profile.publications', { count: userPapers.length })"></h2>
              <template x-if="userPapers.length > 0">
                <div class="space-y-4">
                  <template x-for="paper in userPapers" :key="paper.author + '/' + paper.permlink">
                    <article class="card hover:shadow-sm transition-shadow">
                      <div class="flex items-center justify-between text-xs text-ink-muted mb-3">
                        <div class="flex items-center gap-2">
                          <span class="badge-discipline capitalize" x-text="paper.discipline"></span>
                          <template x-if="paper.source_type && paper.source_type !== 'native'">
                            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wide bg-pevo-teal-light text-pevo-teal-dark border border-pevo-teal/20"
                                  x-text="paper.source_type === 'arxiv' ? 'arXiv' : 'DOI'"></span>
                          </template>
                        </div>
                        <time :datetime="paper.created" x-text="formatDate(paper.created)"></time>
                      </div>
                      <h3 class="text-paper-title leading-snug mb-2">
                        <a :href="'/paper/' + paper.author + '/' + paper.permlink"
                           @click.prevent="navigate('/paper/' + paper.author + '/' + paper.permlink)"
                           class="text-ink hover:text-pevo-teal no-underline" x-text="paper.title"></a>
                      </h3>
                      <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mb-3">
                        <p class="text-sm text-ink-light" x-text="paper.authors.map(a => a.name).join(', ')"></p>
                      </div>
                      <p class="text-sm text-ink-muted leading-relaxed mb-4" x-text="truncateText(paper.abstract)"></p>
                      <div class="flex items-center gap-5 text-xs text-ink-muted pt-3 border-t border-parchment-dark">
                        <span class="flex items-center gap-1">
                          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zm-5 0H8v2h2V9z" clip-rule="evenodd" /></svg>
                          <span x-text="paper.review_count ?? 0"></span>
                        </span>
                      </div>
                    </article>
                  </template>
                </div>
              </template>
              <template x-if="userPapers.length === 0">
                <div class="card text-center py-8">
                  <p class="text-ink-muted" x-text="$t('profile.noPapers')"></p>
                </div>
              </template>
            </section>
          </div>
        </template>
      </div>
    </template>

    <!-- ACCREDITATION -->
    <template x-if="$store.router.route === 'accreditation'">
      <div x-data="accreditationPage" class="container-narrow py-8">
        <h1 class="text-3xl font-bold text-ink mb-2" x-text="$t('accreditation.title')"></h1>
        <p class="text-ink-muted mb-8" x-text="$t('accreditation.description')"></p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="card">
            <h2 class="text-section-title text-ink mb-3 font-serif" x-text="$t('accreditation.whyTitle')"></h2>
            <p class="text-sm text-ink-muted leading-relaxed" x-text="$t('accreditation.whyDescription')"></p>
          </div>
          <div class="card">
            <h2 class="text-section-title text-ink mb-3 font-serif" x-text="$t('accreditation.howTitle')"></h2>
            <ol class="text-sm text-ink-muted leading-relaxed space-y-2 list-decimal list-inside">
              <li x-text="$t('accreditation.step1')"></li>
              <li x-text="$t('accreditation.step2')"></li>
              <li x-text="$t('accreditation.step3')"></li>
              <li x-text="$t('accreditation.step4')"></li>
            </ol>
            <div class="mt-4 pt-3 border-t border-parchment-dark">
              <p class="text-sm text-ink-muted leading-relaxed">
                <strong class="text-ink" x-text="$t('accreditation.wotAlternative')"></strong>
                <span x-text="$t('accreditation.wotDescription', { count: 3, profileLink: $t('accreditation.profilePage') })"></span>
              </p>
            </div>
          </div>
        </div>

        <div class="card mt-6">
          <h2 class="text-section-title text-ink mb-4 font-serif" x-text="$t('accreditation.requestTitle')"></h2>

          <!-- Not connected -->
          <template x-if="!isConnected">
            <div class="bg-pevo-crimson-light border border-pevo-crimson/30 rounded-lg p-4 mb-6">
              <div class="flex items-start gap-3">
                <svg class="h-5 w-5 text-pevo-crimson shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.168 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" /></svg>
                <div>
                  <p class="font-medium text-ink text-sm" x-text="$t('accreditation.walletNotConnected')"></p>
                  <p class="text-xs text-ink-muted mt-1" x-text="$t('accreditation.walletHint')"></p>
                  <button class="btn-primary text-xs mt-2" @click="handleConnect()" x-text="$t('common.connectWallet')"></button>
                </div>
              </div>
            </div>
          </template>

          <!-- Success -->
          <template x-if="step === 'success'">
            <div class="bg-pevo-green-light border border-pevo-green/30 rounded-lg p-4 mb-6">
              <p class="text-sm font-medium text-pevo-green-dark" x-text="resultMessage"></p>
              <p class="text-xs text-pevo-green-dark/80 mt-1" x-text="$t('accreditation.checkEmail')"></p>
            </div>
          </template>

          <!-- Error -->
          <template x-if="step === 'error'">
            <div class="bg-pevo-crimson-light border border-pevo-crimson/30 rounded-lg p-4 mb-6">
              <p class="text-sm font-medium text-pevo-crimson-dark" x-text="errorMessage"></p>
              <button class="btn-secondary text-xs mt-2" @click="step = 'idle'" x-text="$t('accreditation.tryAgain')"></button>
            </div>
          </template>

          <form @submit.prevent="handleSubmit()" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="full-name" class="block text-sm font-medium text-ink mb-1" x-text="$t('accreditation.fullName')"></label>
                <input id="full-name" type="text" class="select-control" :placeholder="$t('accreditation.namePlaceholder')" x-model="fullName" required />
              </div>
              <div>
                <label for="institution" class="block text-sm font-medium text-ink mb-1" x-text="$t('accreditation.institution')"></label>
                <input id="institution" type="text" class="select-control" :placeholder="$t('accreditation.institutionPlaceholder')" x-model="institution" required />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="field" class="block text-sm font-medium text-ink mb-1" x-text="$t('accreditation.fieldOfResearch')"></label>
                <input id="field" type="text" class="select-control" :placeholder="$t('accreditation.fieldPlaceholder')" x-model="field" required />
              </div>
              <div>
                <label for="orcid-input" class="block text-sm font-medium text-ink mb-1" x-text="$t('accreditation.orcidOptional')"></label>
                <input id="orcid-input" type="text" class="select-control" :placeholder="$t('accreditation.orcidPlaceholder')" x-model="orcid" />
              </div>
            </div>
            <div>
              <label for="email" class="block text-sm font-medium text-ink mb-1" x-text="$t('accreditation.email')"></label>
              <input id="email" type="email" class="select-control" :placeholder="$t('accreditation.emailPlaceholder')" x-model="email" required />
              <p class="text-xs text-ink-muted mt-1" x-text="$t('accreditation.emailHint')"></p>
            </div>
            <div class="pt-2 flex flex-col sm:flex-row gap-3">
              <button type="submit" class="btn-primary" :disabled="!isConnected || isSubmitting || step === 'success'"
                      x-text="!isConnected ? $t('accreditation.connectToBegin') : isSubmitting ? $t('accreditation.submittingRequest') : $t('accreditation.submitButton')"></button>
              <span class="text-sm text-ink-muted self-center" x-text="$t('orcid.or')"></span>
              <button type="button" class="btn-secondary flex items-center gap-2" :disabled="!isConnected || orcidLoading || step === 'success'" @click="handleOrcidVerify()">
                <svg class="h-4 w-4" viewBox="0 0 256 256" fill="none"><path d="M256 128C256 198.692 198.692 256 128 256C57.3076 256 0 198.692 0 128C0 57.3076 57.3076 0 128 0C198.692 0 256 57.3076 256 128Z" fill="#A6CE39"/><path d="M86.3 186.2H70.9V79.1H86.3V186.2ZM78.6 56.1C73.5 56.1 69.4 60.2 69.4 65.3C69.4 70.4 73.5 74.5 78.6 74.5C83.7 74.5 87.8 70.4 87.8 65.3C87.8 60.2 83.7 56.1 78.6 56.1ZM108.5 79.1H150.3C185 79.1 200.5 102.7 200.5 132.6C200.5 165.2 181.5 186.2 150.3 186.2H108.5V79.1ZM124 172.5H148.6C175.2 172.5 184.6 153.3 184.6 132.6C184.6 110.6 173.8 92.8 148.6 92.8H124V172.5Z" fill="white"/></svg>
                <span x-text="orcidLoading ? $t('orcid.redirecting') : $t('orcid.verifyButton')"></span>
              </button>
            </div>
          </form>

          <p class="text-sm text-ink-muted mt-4">
            <span x-text="$t('accreditation.needHelp')"></span>
            <a href="/contact?category=accreditation" @click.prevent="navigate('/contact?category=accreditation')" class="text-pevo-teal hover:underline" x-text="$t('accreditation.contactUs')"></a>
          </p>
        </div>
      </div>
    </template>

    <!-- ACCREDITATION VERIFY -->
    <template x-if="$store.router.route === 'accreditation-verify'">
      <div x-data="accreditationVerifyPage" class="container-narrow py-16 text-center">
        <template x-if="state === 'loading'">

                  <div>
                    <label for="contact-email" class="block text-sm font-medium text-ink mb-1" x-text="$t('contact.emailLabel')"></label>
                    <input id="contact-email" type="email" class="select-control"
                           :placeholder="$t('contact.emailPlaceholder')"
                           x-model="email" required />
                  </div>

                  <div>
                    <label for="subject" class="block text-sm font-medium text-ink mb-1" x-text="$t('contact.subjectLabel')"></label>
                    <input id="subject" type="text" class="select-control"
                           :placeholder="$t('contact.subjectPlaceholder')"
                           x-model="subject" required maxlength="200" />
                  </div>

                  <div>
                    <label for="message" class="block text-sm font-medium text-ink mb-1" x-text="$t('contact.messageLabel')"></label>
                    <textarea id="message" class="select-control min-h-[150px]"
                              :placeholder="$t('contact.messagePlaceholder')"
                              x-model="message" required minlength="10" maxlength="5000"></textarea>
                  </div>

                  <!-- Honeypot -->
                  <div class="absolute -left-[9999px]" aria-hidden="true">
                    <label for="website">Website</label>
                    <input id="website" type="text" tabindex="-1" autocomplete="off" x-model="website" />
                  </div>

                  <div class="pt-2">
                    <button type="submit" class="btn-primary" :disabled="step === 'submitting'"
                            x-text="step === 'submitting' ? $t('contact.submitting') : $t('contact.submitButton')"></button>
                  </div>
                </form>
              </template>
            </div>
          </div>

          <!-- Info sidebar -->
          <div class="space-y-4">
            <div class="card">
              <h3 class="text-sm font-semibold text-ink mb-3" x-text="$t('contact.infoTitle')"></h3>
              <ul class="space-y-4 text-sm">
                <li>
                  <p class="font-medium text-ink" x-text="$t('contact.emailUs')"></p>
                  <a href="mailto:support@pevo.science" class="text-pevo-teal hover:underline break-all">support@pevo.science</a>
                </li>
                <li>
                  <p class="font-medium text-ink" x-text="$t('contact.githubIssues')"></p>
                  <p class="text-ink-muted text-xs mb-1" x-text="$t('contact.githubIssuesDesc')"></p>
                  <a href="https://github.com/pharesim/pevo-science/issues" target="_blank" rel="noopener noreferrer"
                     class="text-pevo-teal hover:underline">GitHub Issues</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </template>

  </main>

  <!-- ═══════════════════════════════════════════════ FOOTER ═══════════════════════════════════════════════ -->
  <footer x-data="footer" class="border-t border-parchment-dark bg-white mt-auto">
    <div class="container-narrow py-8">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-8">
        <!-- Brand -->
        <div>
          <div class="flex items-center gap-2 mb-3">
            <img src="/images/pevo-logo.png" alt="PEvO logo" width="28" height="28" class="rounded-sm" />
            <span class="text-lg font-bold text-ink">pevo</span>
          </div>
          <p class="text-sm text-ink-muted leading-relaxed" x-text="$t('footer.description')"></p>
          <p class="text-xs text-pevo-teal mt-2 font-medium" x-text="$t('footer.tagline')"></p>
        </div>

        <!-- Links -->
        <div>
          <p class="font-sans text-sm font-semibold text-ink mb-3" x-text="$t('footer.platform')"></p>
          <ul class="space-y-2 text-sm">
            <li><a href="/" @click.prevent="navigate('/')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.paperFeed')"></a></li>
            <li><a href="/publish" @click.prevent="navigate('/publish')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.publishPaper')"></a></li>
            <li><a href="/accreditation" @click.prevent="navigate('/accreditation')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('nav.accreditation')"></a></li>
            <li><a href="/about" @click.prevent="navigate('/about')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.aboutPevo')"></a></li>
            <li><a href="/getting-started" @click.prevent="navigate('/getting-started')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.gettingStarted')"></a></li>
            <li><a href="/faq" @click.prevent="navigate('/faq')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.faq')"></a></li>
            <li><a href="/contact" @click.prevent="navigate('/contact')" class="text-ink-muted hover:text-pevo-teal no-underline" x-text="$t('footer.contact')"></a></li>
          </ul>
        </div>

        <!-- Resources -->
        <div>
          <p class="font-sans text-sm font-semibold text-ink mb-3" x-text="$t('footer.resources')"></p>
          <ul class="space-y-2 text-sm">
            <li><a href="https://github.com/pharesim/pevo-science" target="_blank" rel="noopener noreferrer" class="text-ink-muted hover:text-pevo-teal no-underline">GitHub</a></li>
            <li><a href="https://hive.io" target="_blank" rel="noopener noreferrer" class="text-ink-muted hover:text-pevo-teal no-underline">Hive Network</a></li>
            <li><a href="https://hive-keychain.com/" target="_blank" rel="noopener noreferrer" class="text-ink-muted hover:text-pevo-teal no-underline">Hive Keychain</a></li>
          </ul>
        </div>
      </div>

      <!-- Bottom bar -->
      <div class="mt-8 pt-4 border-t border-parchment-dark flex flex-col sm:flex-row items-center justify-between gap-2">
        <p class="text-xs text-ink-muted" x-text="$t('footer.license')"></p>
        <a href="https://hive.io" target="_blank" rel="noopener noreferrer"
           class="flex items-center gap-1.5 text-xs text-ink-muted hover:text-pevo-teal no-underline">
          <img src="/images/hive-logo.svg" alt="Hive logo" width="16" height="16" style="width:16px;height:auto" />
          Powered by Hive
        </a>
        <p class="text-xs text-ink-muted">pevo.science</p>
      </div>
    </div>
    <!-- Bottom brand bar -->
    <div class="h-1 bg-gradient-to-r from-pevo-green via-pevo-teal to-pevo-crimson"></div>
  </footer>

  <!-- ═══════════════════════════════════════════════ ONBOARDING MODAL ═══════════════════════════════════ -->
  <div x-data="onboardingModal">
    <template x-if="open">
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
           @click="handleBackdropClick($event)" @keydown.window="handleKeydown($event)"
           role="dialog" aria-modal="true" aria-labelledby="onboarding-modal-title">
        <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 sm:p-8 relative">
          <!-- Close button -->
          <button class="absolute top-3 right-3 rtl:right-auto rtl:left-3 text-ink-muted hover:text-ink p-1"
                  @click="dismiss()" aria-label="Close">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          <h2 id="onboarding-modal-title" class="text-2xl font-bold text-ink mb-2" x-text="$t('onboarding.title')"></h2>
          <p class="text-sm text-ink-muted mb-6" x-text="$t('onboarding.description')"></p>

          <div class="space-y-4">
            <!-- Accreditation — only when not accredited -->
            <template x-if="!isAccredited">
              <div class="flex items-start gap-3">
                <div class="flex-shrink-0 w-10 h-10 rounded-full bg-pevo-crimson-light flex items-center justify-center">
                  <svg class="w-5 h-5 text-pevo-crimson" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
                  </svg>
                </div>
                <div class="flex-1">
                  <h3 class="text-sm font-semibold text-ink" x-text="$t('onboarding.accreditTitle')"></h3>
                  <p class="text-xs text-ink-muted" x-text="$t('onboarding.accreditDescription')"></p>
                </div>
                <button class="btn-primary text-xs no-underline" @click="navigateAndDismiss('/accreditation')" x-text="$t('onboarding.accreditButton')"></button>
              </div>
            </template>

            <!-- Browse -->
            <div class="flex items-start gap-3">
              <div class="flex-shrink-0 w-10 h-10 rounded-full bg-pevo-teal-light flex items-center justify-center">
                <svg class="w-5 h-5 text-pevo-teal" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                </svg>
              </div>
              <div class="flex-1">
                <h3 class="text-sm font-semibold text-ink" x-text="$t('onboarding.browseTitle')"></h3>
                <p class="text-xs text-ink-muted" x-text="$t('onboarding.browseDescription')"></p>
              </div>
              <button class="btn-primary text-xs no-underline" @click="navigateAndDismiss('/')" x-text="$t('onboarding.browseButton')"></button>
            </div>

            <!-- Publish -->
            <div class="flex items-start gap-3">
              <div class="flex-shrink-0 w-10 h-10 rounded-full bg-pevo-green-light flex items-center justify-center">
                <svg class="w-5 h-5 text-pevo-green" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
              </div>
              <div class="flex-1">
                <h3 class="text-sm font-semibold text-ink" x-text="$t('onboarding.publishTitle')"></h3>
                <p class="text-xs text-ink-muted" x-text="$t('onboarding.publishDescription')"></p>
              </div>
              <button class="btn-primary text-xs no-underline" @click="navigateAndDismiss('/publish')" x-text="$t('onboarding.publishButton')"></button>
            </div>
          </div>

          <div class="mt-6 text-center">
            <button class="text-sm text-ink-muted hover:text-pevo-teal transition-colors" @click="dismiss()" x-text="$t('onboarding.dismissButton')"></button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- ═══════════════════════════════════════════════ USERNAME MODAL ═══════════════════════════════════ -->
  <div x-data="usernameModal">
    <template x-if="open">
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
           @click="handleBackdropClick($event)" @keydown.window="handleKeydown($event)"
           role="dialog" aria-modal="true" aria-labelledby="username-modal-title">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4 p-6">
          <h2 id="username-modal-title" class="text-lg font-semibold text-ink mb-4">Enter your Hive username</h2>

          <label for="hive-username-input" class="sr-only">Hive username</label>
          <input id="hive-username-input" x-ref="usernameInput" type="text"
                 class="w-full px-3 py-2 border border-parchment-dark rounded-md text-sm text-ink focus:outline-none focus:ring-2 focus:ring-pevo-teal focus:border-transparent"
                 placeholder="e.g. satoshi"
                 x-model="value"
                 @input="error = null"
                 @keydown="handleInputKeydown($event)" />

          <template x-if="error">
            <p class="text-sm text-pevo-crimson mt-1" x-text="error"></p>
          </template>

          <p class="text-sm text-ink/60 mt-3">
            Don't have an account?
            <a href="/getting-started" class="text-pevo-teal hover:underline font-medium" @click="cancel()">Get started</a>
          </p>

          <div class="flex justify-end gap-3 mt-5">
            <button type="button" class="btn-secondary text-sm px-4 py-2" @click="cancel()">Cancel</button>
            <button type="button" class="btn-primary text-sm px-4 py-2" @click="confirm()">Connect</button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- ═══════════════════════════════════════════════ TOAST ═══════════════════════════════════════════════ -->
  <div class="fixed bottom-4 right-4 z-50 flex flex-col-reverse gap-2 max-w-sm w-full pointer-events-none" aria-live="polite">
    <template x-for="item in $store.toast.items" :key="item.id">
      <div class="pointer-events-auto flex items-start gap-3 rounded-lg border px-4 py-3 shadow-md transition-all duration-300"
           :class="{
             'border-pevo-crimson/40 bg-pevo-crimson-light text-ink': item.type === 'error',
             'border-pevo-green/40 bg-pevo-green-light text-ink': item.type === 'success',
             'border-pevo-teal/40 bg-pevo-teal-light text-ink': item.type === 'info',
             'opacity-0 translate-x-4': item.removing,
             'opacity-100 translate-x-0': !item.removing,
           }"
           role="alert">
        <!-- Icon -->
        <span :class="{
          'text-pevo-crimson': item.type === 'error',
          'text-pevo-green': item.type === 'success',
          'text-pevo-teal': item.type === 'info',
        }">
          <template x-if="item.type === 'error'">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
            </svg>
          </template>
          <template x-if="item.type === 'success'">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
            </svg>
          </template>
          <template x-if="item.type === 'info'">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd" />
            </svg>
          </template>
        </span>
        <p class="text-sm flex-1" x-text="item.message"></p>
        <button @click="$store.toast.dismiss(item.id)"
                class="shrink-0 text-ink-muted hover:text-ink transition-colors p-0.5" aria-label="Dismiss">
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </template>
  </div>

</body>
</html>
